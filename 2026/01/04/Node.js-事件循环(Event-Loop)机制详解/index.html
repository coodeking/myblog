<!doctype html>
<html><head><meta charset="utf-8"><title>加载中…</title>
<style>body{font:16px/1.6 sans-serif;color:#333;padding:40px}</style>
</head><body>
<p>正在加载，请稍等…</p>
<script>
fetch("https://cdn.jsdelivr.net/gh/coodeking/myblog@3f6a070b34a8fcddaa7219505ff747625b372aff/2026/01/04/Node.js-%E4%BA%8B%E4%BB%B6%E5%BE%AA%E7%8E%AF%28Event-Loop%29%E6%9C%BA%E5%88%B6%E8%AF%A6%E8%A7%A3/index.html")
  .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.text(); })
  .then(function(t){ document.open(); document.write(t); document.close(); })
  .catch(function(e){ document.body.innerHTML = '<p>页面加载失败：'+e.message+'。请刷新重试。</p>'; });
</script>
</body></html>
