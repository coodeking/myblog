      content: "";

      padding: 26px;

    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 18px; }
    .course { border: 1px solid var(--line); border-radius: 20px; background: var(--card); padding: 18px; }

    .course ul { padding-left: 18px; color: #4d4439; }
    .course li { margin: 7px 0; }
    .math h3, .subject.math h4 { color: var(--blue); }
    .english h3, .subject.english h4 { color: var(--green); }
    .politics h3, .subject.politics h4 { color: var(--brick); }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin: 22px 2px 14px; gap: 12px; color: var(--muted); }
    button {
      font: inherit;
      border: 1px solid rgba(120, 80, 38, .28);
      background: #2b2118;
      color: #fff8ed;
      border-radius: 999px;
      padding: 10px 16px;
      cursor: pointer;
    }
    .weeks { display: grid; gap: 14px; }
    .week-card { border: 1px solid var(--line); border-radius: 24px; background: rgba(255,253,248,.92); overflow: hidden; box-shadow: 0 10px 34px rgba(88,52,19,.08); }
    .week-head { width: 100%; display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center; background: transparent; color: var(--ink); border: 0; border-radius: 0; padding: 18px 20px; text-align: left; }
    .week-head:hover { background: rgba(243,229,210,.55); }
    .kicker { display: block; color: var(--muted); font-size: .82rem; letter-spacing: .08em; }
    .week-head h3 { font-size: 1.1rem; line-height: 1.35; }
    .date { color: var(--muted); white-space: nowrap; }
    .chev { color: var(--muted); transition: transform .18s ease; }
    .week-card.open .chev { transform: rotate(180deg); }
    .week-body { display: none; border-top: 1px solid var(--line); padding: 18px 20px 20px; }
    .week-card.open .week-body { display: block; }
    .message { background: var(--soft); border-left: 4px solid #bf7a36; border-radius: 14px; padding: 14px 16px; margin-bottom: 16px; color: #4b3a28; white-space: pre-line; }
    .subjects { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .subject { border: 1px solid var(--line); border-radius: 18px; background: white; padding: 15px 16px; }
    .subject h4 { margin-bottom: 8px; font-size: 1rem; }
    .subject p { color: #464038; margin-top: 10px; white-space: pre-line; }
    footer { text-align: center; color: var(--muted); margin-top: 26px; font-size: .92rem; }
    @media (max-width: 1050px) {
      .grid, .subjects { grid-template-columns: 1fr; }
      .week-head { grid-template-columns: 1fr; }
      .date { white-space: normal; }
      header { padding: 26px; }
    }
  </style>
</head>

    const metaOne = document.getElementById('meta-one');
    const metaTwo = document.getElementById('meta-two');
    const s = planData.student;
    metaOne.innerHTML = [s.name, s.target, s.exam, s.subjects].map(x => `<span>${x}</span>`).join('');
    metaTwo.innerHTML = [s.period, s.hours, s.status].map(x => `<span>${x}</span>`).join('');
    document.getElementById('intro').textContent = planData.overview.intro;
    document.getElementById('strategy').textContent = planData.overview.strategy;

    function fillList(id, items) {
      document.getElementById(id).innerHTML = items.map(item => `<li>${item}</li>`).join('');
    }
    fillList('math-list', planData.overview.math);
    fillList('english-list', planData.overview.english);
    fillList('politics-list', planData.overview.politics);
    document.getElementById('range').textContent = `${planData.weeks.length}周公共课排期：${s.period}`;

    const weeksEl = document.getElementById('weeks');
    weeksEl.innerHTML = planData.weeks.map((week, idx) => `
      <article class="week-card ${idx < 2 ? 'open' : ''}">
        <button type="button" class="week-head" aria-expanded="${idx < 2 ? 'true' : 'false'}">
          <span><span class="kicker">第${week.week}周</span><h3>${week.title}</h3></span>
          <span class="date">${week.date}</span>
          <span class="chev">⌄</span>
        </button>
        <div class="week-body">
          <div class="message">${week.message}</div>
          <div class="subjects">
            <div class="subject math"><h4>数学二</h4><p>${week.math}</p></div>
            <div class="subject english"><h4>英语二</h4><p>${week.english}</p></div>
            <div class="subject politics"><h4>政治</h4><p>${week.politics}</p></div>
          </div>
        </div>
      </article>
    `).join('');

    const cards = [...document.querySelectorAll('.week-card')];
    cards.forEach(card => {
      const btn = card.querySelector('.week-head');
      btn.addEventListener('click', () => {
        const open = card.classList.toggle('open');
        btn.setAttribute('aria-expanded', String(open));
      });
    });

    const toggle = document.getElementById('toggle-all');
    toggle.addEventListener('click', () => {
      const shouldOpen = cards.some(card => !card.classList.contains('open'));
      cards.forEach(card => {
        card.classList.toggle('open', shouldOpen);
        card.querySelector('.week-head').setAttribute('aria-expanded', String(shouldOpen));
      });
      toggle.textContent = shouldOpen ? '收起全部' : '展开全部';
    });
  </script>
