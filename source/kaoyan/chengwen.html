    <style>
        :root {

            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: rgba(154, 90, 32, .13);

        .stat b { display: block; font-size: 1.3rem; color: var(--brick); margin-bottom: 4px; }
        .stat span { color: var(--muted); font-size: .94rem; }

        .hint { color: var(--muted); font-size: .94rem; }
        .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
        .card {
            border: 1px solid var(--line);
            border-radius: 22px;
            background: rgba(255, 253, 248, .9);
            padding: 20px;
            box-shadow: 0 16px 35px rgba(83, 45, 15, .08);

            border: 1px dashed var(--line);
            border-radius: 16px;
            background: rgba(243, 229, 210, .45);

        .phases { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
        .phase {
            min-height: 132px;
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 14px;
            background: linear-gradient(180deg, #fffdf8, #f7ead8);

        .phase b { display: block; color: var(--green); margin-bottom: 6px; }
        .phase span { color: var(--muted); font-size: .92rem; }
        .toolbar {
            position: sticky;
            top: 0;
            z-index: 5;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--line);
            background: rgba(255, 248, 237, .94);
            backdrop-filter: blur(16px);
            border-radius: 18px;
            padding: 12px;
            margin: 24px 0 12px;

        .filters { display: flex; flex-wrap: wrap; gap: 8px; }
        button {
            cursor: pointer;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--ink);
            border-radius: 999px;
            padding: 8px 13px;
            font: inherit;

        button.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
        .week-list { display: grid; gap: 12px; }
        .week {
            border: 1px solid var(--line);
            border-radius: 22px;
            background: rgba(255, 253, 248, .94);
            overflow: hidden;
            box-shadow: 0 14px 34px rgba(83, 45, 15, .08);
        }
        .week summary {
            list-style: none;
            cursor: pointer;
            padding: 18px 20px;
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 14px;
            align-items: center;
        }
        .week summary::-webkit-details-marker { display: none; }
        .num {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            background: var(--soft);
            color: var(--brick);
            font-weight: 800;
        }
        .week-title b { display: block; font-size: 1.08rem; }
        .week-title span { display: block; color: var(--muted); font-size: .92rem; margin-top: 2px; }
        .pill { color: var(--green); border: 1px solid rgba(29, 111, 95, .25); padding: 6px 10px; border-radius: 999px; font-size: .86rem; white-space: nowrap; }
        .week-body { border-top: 1px solid var(--line); padding: 18px 22px 22px 82px; color: #3f3328; white-space: pre-line; }
        footer { margin-top: 28px; color: var(--muted); text-align: center; }
        @media (max-width: 880px) {
            .stats, .grid, .phases { grid-template-columns: 1fr; }
            .week summary { grid-template-columns: auto 1fr; }
            .pill { grid-column: 1 / -1; width: fit-content; }
            .week-body { padding-left: 20px; }
        }
    </style>
</head>

        const $ = (id) => document.getElementById(id);
        $("title").textContent = `${planData.student.name}的西华大学408专业课规划`;
        $("subtitle").textContent = `按${planData.student.subject}准备，从${planData.student.period}，一共${planData.student.weeks}周。重点照顾跨考零基础、听课容易舒服但做题少、计算题容易卡住这几个问题。`;

        [
            ["目标", planData.student.target],
            ["科目", planData.student.subject],
            ["周期", planData.student.period],
            ["周数", `${planData.student.weeks}周`],
        ].forEach(([k, v]) => {
            const div = document.createElement("div");
            div.className = "stat";
            div.innerHTML = `<b>${k}</b><span>${v}</span>`;
            $("stats").appendChild(div);
        });

        planData.basis.forEach((item) => {
            const card = document.createElement("article");
            card.className = "card";
            const h3 = document.createElement("h3");
            h3.textContent = item.title;
            const p = document.createElement("p");
            p.textContent = item.text;
            card.append(h3, p);
            $("basis").appendChild(card);
        });

        planData.materials.forEach((item) => {
            const li = document.createElement("li");
            li.textContent = item;
            $("materials").appendChild(li);
        });

        planData.phases.forEach((item) => {
            const div = document.createElement("div");
            div.className = "phase";
            div.innerHTML = `<b>${item.name}</b><span>${item.text}</span>`;
            $("phases").appendChild(div);
        });

        const phases = ["全部", ...Array.from(new Set(planData.weeks.map((w) => w.phase)))];
        let current = "全部";
        const renderFilters = () => {
            $("filters").innerHTML = "";
            phases.forEach((phase) => {
                const btn = document.createElement("button");
                btn.textContent = phase;
                btn.className = phase === current ? "active" : "";
                btn.onclick = () => {
                    current = phase;
                    renderFilters();
                    renderWeeks();
                };
                $("filters").appendChild(btn);
            });
        };

        const renderWeeks = () => {
            $("weeks").innerHTML = "";
            planData.weeks
                .filter((w) => current === "全部" || w.phase === current)
                .forEach((week, index) => {
                    const card = document.createElement("details");
                    card.className = "week";
                    if (index < 2 && current === "全部") card.open = true;
                    const summary = document.createElement("summary");
                    summary.innerHTML = `
                        <div class="num">${week.week}</div>
                        <div class="week-title">
                            <b>${week.title}</b>
                            <span>${week.date}</span>
                        </div>
                        <div class="pill">${week.phase}</div>
                    `;
                    const body = document.createElement("div");
                    body.className = "week-body";
                    body.textContent = week.body;
                    card.append(summary, body);
                    $("weeks").appendChild(card);
                });
        };

        renderFilters();
        renderWeeks();
    </script>
