        const title = document.getElementById("title");
        const subtitle = document.getElementById("subtitle");
        const stats = document.getElementById("stats");
        const basis = document.getElementById("basis");
        const materials = document.getElementById("materials");
        const phases = document.getElementById("phases");
        const filters = document.getElementById("filters");
        const weeksEl = document.getElementById("weeks");
        const toggleAll = document.getElementById("toggle-all");

        title.textContent = `${planData.student.name}的${planData.student.subject}规划`;
        subtitle.textContent = `${planData.student.target}，${planData.student.major}方向。${planData.student.status}。这份表从${planData.student.period}，只排专业课，不改公共课页面。`;

        [
            ["目标院校", planData.student.target],
            ["考试科目", planData.student.subject],
            ["周期", `${planData.student.weeks}周`],
            ["每天时间", planData.student.hours],
        ].forEach(([label, value]) => {
            const div = document.createElement("div");
            div.className = "stat";
            const b = document.createElement("b");
            b.textContent = value;
            const span = document.createElement("span");
            span.textContent = label;
            div.append(b, span);
            stats.appendChild(div);
        });

        planData.basis.forEach(item => {
            const div = document.createElement("article");
            div.className = "card";
            const h3 = document.createElement("h3");
            h3.textContent = item.title;
            const p = document.createElement("p");
            p.textContent = item.text;
            div.append(h3, p);
            basis.appendChild(div);
        });

        planData.materials.forEach(text => {
            const li = document.createElement("li");
            li.textContent = text;
            materials.appendChild(li);
        });

        planData.phases.forEach(item => {
            const div = document.createElement("div");
            div.className = "phase";
            const b = document.createElement("b");
            b.textContent = item.name;
            const span = document.createElement("span");
            span.textContent = item.text;
            div.append(b, span);
            phases.appendChild(div);
        });

        const phaseNames = ["全部", ...Array.from(new Set(planData.weeks.map(w => w.phase)))];
        let currentPhase = "全部";

        function renderFilters() {
            filters.innerHTML = "";
            phaseNames.forEach(name => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.textContent = name;
                if (name === currentPhase) btn.classList.add("active");
                btn.addEventListener("click", () => {
                    currentPhase = name;
                    renderFilters();
                    renderWeeks();
                });
                filters.appendChild(btn);
            });
        }

        function renderWeeks() {
            weeksEl.innerHTML = "";
            planData.weeks
                .filter(w => currentPhase === "全部" || w.phase === currentPhase)
                .forEach((week, index) => {
                    const details = document.createElement("details");
                    details.className = "week";
                    details.open = currentPhase !== "全部" || index < 2;

                    const summary = document.createElement("summary");
                    const num = document.createElement("div");
                    num.className = "num";
                    num.textContent = week.week;

                    const titleBox = document.createElement("div");
                    titleBox.className = "week-title";
                    const b = document.createElement("b");
                    b.textContent = week.title;
                    const span = document.createElement("span");
                    span.textContent = week.date;
                    titleBox.append(b, span);

                    const pill = document.createElement("div");
                    pill.className = "pill";
                    pill.textContent = week.phase;

                    const body = document.createElement("div");
                    body.className = "week-body";
                    body.textContent = week.body;

                    summary.append(num, titleBox, pill);
                    details.append(summary, body);
                    weeksEl.appendChild(details);
                });
        }

        toggleAll.addEventListener("click", () => {
            const all = Array.from(document.querySelectorAll(".week"));
            const shouldOpen = all.some(item => !item.open);
            all.forEach(item => { item.open = shouldOpen; });
            toggleAll.textContent = shouldOpen ? "收起全部" : "展开全部";
        });

        renderFilters();
        renderWeeks();
    </script>
