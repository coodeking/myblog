        const metaOne = document.getElementById("meta-one");
        [planData.student.target, planData.student.exam, planData.student.subjects].forEach(text => {
            const span = document.createElement("span");
            span.textContent = text;
            metaOne.appendChild(span);
        });
        const metaTwo = document.getElementById("meta-two");
        [planData.student.hours, planData.student.status].forEach(text => {
            const span = document.createElement("span");
            span.textContent = text;
            metaTwo.appendChild(span);
        });
        document.getElementById("intro").textContent = planData.overview.intro;
        document.getElementById("strategy").textContent = planData.overview.strategy;
        const lists = {
            "math-list": planData.overview.materials.filter(x => x.startsWith("数学") || x.startsWith("数学二")),
            "english-list": planData.overview.materials.filter(x => x.startsWith("英语")),
            "politics-list": planData.overview.materials.filter(x => x.startsWith("政治"))
        };
        Object.entries(lists).forEach(([id, items]) => {
            const ul = document.getElementById(id);
            items.forEach(item => {
                const li = document.createElement("li");
                li.textContent = item;
                ul.appendChild(li);
            });
        });

        const weeksEl = document.getElementById("weeks");
        planData.weeks.forEach((week, index) => {
            const card = document.createElement("article");
            card.className = `week-card${index < 2 ? " open" : ""}`;

            const head = document.createElement("button");
            head.className = "week-head";
            head.type = "button";
            const titleWrap = document.createElement("div");
            const kicker = document.createElement("span");
            kicker.className = "kicker";
            kicker.textContent = `第 ${week.week} 周`;
            const h3 = document.createElement("h3");
            h3.textContent = week.title;
            titleWrap.appendChild(kicker);
            titleWrap.appendChild(h3);
            const date = document.createElement("span");
            date.className = "date";
            date.textContent = week.date;
            const chev = document.createElement("span");
            chev.className = "chev";
            chev.textContent = "⌄";
            head.appendChild(titleWrap);
            head.appendChild(date);
            head.appendChild(chev);

            const body = document.createElement("div");
            body.className = "week-body";
            const msg = document.createElement("div");
            msg.className = "message";
            msg.textContent = week.message;
            body.appendChild(msg);

            const subjects = document.createElement("div");
            subjects.className = "subjects";
            [
                ["math", "数学二", week.math],
                ["english", "英语二", week.english],
                ["politics", "政治", week.politics],
            ].forEach(([cls, name, content]) => {
                const box = document.createElement("section");
                box.className = `subject ${cls}`;
                const h4 = document.createElement("h4");
                h4.textContent = name;
                const p = document.createElement("p");
                p.textContent = content;
                box.appendChild(h4);
                box.appendChild(p);
                subjects.appendChild(box);
            });
            body.appendChild(subjects);
            head.addEventListener("click", () => card.classList.toggle("open"));
            card.appendChild(head);
            card.appendChild(body);
            weeksEl.appendChild(card);
        });

        const toggle = document.getElementById("toggle-all");
        let expanded = false;
        toggle.addEventListener("click", () => {
            expanded = !expanded;
            document.querySelectorAll(".week-card").forEach(card => card.classList.toggle("open", expanded));
            toggle.textContent = expanded ? "收起全部" : "展开全部";
        });
    </script>
