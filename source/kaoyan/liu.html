document.getElementById("strategy").textContent = planData.strategy;
const overview = document.getElementById("overview");
planData.overview.forEach(item => {
  const card = document.createElement("article");
  card.className = "course";
  const title = document.createElement("h3");
  title.textContent = item[0];
  const text = document.createElement("p");
  text.textContent = item[1];
  card.appendChild(title);
  card.appendChild(text);
  overview.appendChild(card);
});
const weeksNode = document.getElementById("weeks");
document.getElementById("countText").textContent = `按真实起步时间排成 ${planData.weeks.length} 周，默认展开前两周。`;
function makeSubject(title, className, text) {
  const node = document.createElement("article");
  node.className = `subject ${className}`;
  const h = document.createElement("h4");
  h.textContent = title;
  const p = document.createElement("p");
  p.textContent = text;
  node.appendChild(h);
  node.appendChild(p);
  return node;
}
planData.weeks.forEach((week, index) => {
  const card = document.createElement("article");
  card.className = "week-card" + (index < 2 ? " open" : "");
  const head = document.createElement("button");
  head.className = "week-head";
  head.type = "button";
  const titleWrap = document.createElement("div");
  const kicker = document.createElement("span");
  kicker.className = "kicker";
  kicker.textContent = `第 ${week.week} 周`;
  const title = document.createElement("h3");
  title.textContent = week.topic;
  titleWrap.appendChild(kicker);
  titleWrap.appendChild(title);
  const date = document.createElement("span");
  date.className = "date";
  date.textContent = week.date;
  const chev = document.createElement("span");
  chev.className = "chev";
  chev.textContent = "v";
  head.appendChild(titleWrap);
  head.appendChild(date);
  head.appendChild(chev);
  const body = document.createElement("div");
  body.className = "week-body";
  const msg = document.createElement("div");
  msg.className = "message";
  msg.textContent = week.message;
  const subjects = document.createElement("div");
  subjects.className = "subjects";
  subjects.appendChild(makeSubject("数学二", "math", week.math));
  subjects.appendChild(makeSubject("英语二", "english", week.english));
  subjects.appendChild(makeSubject("政治", "politics", week.politics));
  body.appendChild(msg);
  body.appendChild(subjects);
  head.addEventListener("click", () => card.classList.toggle("open"));
  card.appendChild(head);
  card.appendChild(body);
  weeksNode.appendChild(card);
});
const toggle = document.getElementById("toggleAll");
toggle.addEventListener("click", () => {
  const cards = Array.from(document.querySelectorAll(".week-card"));
  const shouldOpen = cards.some(card => !card.classList.contains("open"));
  cards.forEach(card => card.classList.toggle("open", shouldOpen));
  toggle.textContent = shouldOpen ? "收起全部" : "展开全部";
});
</script>
