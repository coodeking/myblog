        function addPill(target, text) {
            const span = document.createElement("span");
            span.textContent = text;
            target.appendChild(span);
        }

        function fillList(id, items) {
            const el = document.getElementById(id);
            items.forEach((item) => {
                const li = document.createElement("li");
                li.textContent = item;
                el.appendChild(li);
            });
        }

        addPill(document.getElementById("meta-one"), `目标：${planData.student.target}`);
        addPill(document.getElementById("meta-one"), `年份：${planData.student.exam_year}`);
        addPill(document.getElementById("meta-one"), planData.student.status);
        addPill(document.getElementById("meta-two"), `时间：${planData.student.period}`);
        addPill(document.getElementById("meta-two"), `科目：${planData.student.subjects}`);
        addPill(document.getElementById("meta-two"), `可用时间：${planData.student.hours}`);
        document.getElementById("intro").textContent = planData.overview.intro;
        document.getElementById("strategy").textContent = `核心原则：所有科目都不当耐听王，多想、多算、多做，落实到笔头。\n\n${planData.overview.strategy}`;
        fillList("math-list", planData.overview.math);
        fillList("english-list", planData.overview.english);
        fillList("politics-list", planData.overview.politics);
        fillList("major-list", planData.overview.major);
        fillList("execution-list", planData.overview.execution);

        const weeksEl = document.getElementById("weeks");
        planData.weeks.forEach((week, index) => {
            const card = document.createElement("article");
            card.className = `week-card${index < 2 ? " open" : ""}`;

            const head = document.createElement("button");
            head.type = "button";
            head.className = "week-head";
            head.setAttribute("aria-expanded", index < 2 ? "true" : "false");

            const titleWrap = document.createElement("div");
            const kicker = document.createElement("span");
            kicker.className = "kicker";
            kicker.textContent = `WEEK ${String(week.week).padStart(2, "0")}`;
            const h3 = document.createElement("h3");
            h3.textContent = week.title;
            titleWrap.appendChild(kicker);
            titleWrap.appendChild(h3);

            const dateText = document.createElement("span");
            dateText.className = "date";
            dateText.textContent = week.date;
            const chev = document.createElement("span");
            chev.className = "chev";
            chev.textContent = "⌄";

            head.appendChild(titleWrap);
            head.appendChild(dateText);
            head.appendChild(chev);

            const body = document.createElement("div");
            body.className = "week-body";
            const msg = document.createElement("p");
            msg.className = "message";
            msg.textContent = week.message;
            body.appendChild(msg);

            const subjects = document.createElement("div");
            subjects.className = "subjects";
            [
                ["math", "数学二", week.math],
                ["english", "英语二", week.english],
                ["politics", "政治", week.politics],
                ["major", "408计算机学科专业基础", week.major],
            ].forEach(([cls, title, text]) => {
                const section = document.createElement("section");
                section.className = `subject ${cls}`;
                const h4 = document.createElement("h4");
                h4.textContent = title;
                const p = document.createElement("p");
                p.textContent = text;
                section.appendChild(h4);
                section.appendChild(p);
                subjects.appendChild(section);
            });
            body.appendChild(subjects);

            head.addEventListener("click", () => {
                const isOpen = card.classList.toggle("open");
                head.setAttribute("aria-expanded", isOpen ? "true" : "false");
            });
            card.appendChild(head);
            card.appendChild(body);
            weeksEl.appendChild(card);
        });

        document.getElementById("toggle-all").addEventListener("click", (event) => {
            const cards = [...document.querySelectorAll(".week-card")];
            const shouldOpen = cards.some((card) => !card.classList.contains("open"));
            cards.forEach((card) => {
                card.classList.toggle("open", shouldOpen);
                const head = card.querySelector(".week-head");
                head.setAttribute("aria-expanded", shouldOpen ? "true" : "false");
            });
            event.currentTarget.textContent = shouldOpen ? "收起全部" : "展开全部";
        });
    </script>
</body>
