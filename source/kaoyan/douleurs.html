const setText = (id, text) => { document.getElementById(id).textContent = text; };
setText("title", `${planData.student.name} 2026考研公共课规划`);
setText("target", `目标：${planData.student.target}`);
setText("exam", planData.student.period);
setText("period", `节奏：${planData.student.hours}`);
setText("subject", `科目：${planData.student.subject}`);
setText("intro", planData.overview.intro);
setText("strategy", planData.overview.strategy);
setText("countText", `共 ${planData.weeks.length} 周，默认展开前两周`);

const materials = document.getElementById("materials");
planData.overview.materials.forEach((item, index) => {
    const card = document.createElement("article");
    card.className = "course";
    const titles = ["英语主线", "政治主线", "执行方法"];
    card.innerHTML = `<h3>${titles[index]}</h3><p>${item}</p>`;
    materials.appendChild(card);
});

const blocks = document.getElementById("blocks");
planData.overview.blocks.forEach((item) => {
    const card = document.createElement("article");
    card.className = "block";
    card.innerHTML = `<b>${item[0]}</b><em>${item[1]}</em><span>${item[2]}</span>`;
    blocks.appendChild(card);
});

const weeksNode = document.getElementById("weeks");
planData.weeks.forEach((week, index) => {
    const card = document.createElement("article");
    card.className = `week-card${index < 2 ? " open" : ""}`;
    const head = document.createElement("button");
    head.className = "week-head";
    head.type = "button";
    head.innerHTML = `
        <div>
            <span class="kicker">第${week.week}周 · ${week.phase}</span>
            <h3>${week.title}</h3>
        </div>
        <span class="date">${week.date}</span>
        <span class="chev">${index < 2 ? "收起" : "展开"}</span>
    `;
    const body = document.createElement("div");
    body.className = "week-body";
    const message = document.createElement("p");
    message.className = "strategy";
    message.textContent = week.message;
    const grid = document.createElement("div");
    grid.className = "subjects";
    [
        ["english", "英语二"],
        ["politics", "政治"],
    ].forEach(([cls, title]) => {
        const section = document.createElement("section");
        section.className = `subject ${cls}`;
        const h4 = document.createElement("h4");
        h4.textContent = title;
        const p = document.createElement("p");
        p.textContent = week[cls];
        section.append(h4, p);
        grid.appendChild(section);
    });
    body.append(message, grid);
    head.addEventListener("click", () => {
        card.classList.toggle("open");
        head.querySelector(".chev").textContent = card.classList.contains("open") ? "收起" : "展开";
    });
    card.append(head, body);
    weeksNode.appendChild(card);
});

const toggle = document.getElementById("toggleAll");
toggle.addEventListener("click", () => {
    const cards = Array.from(document.querySelectorAll(".week-card"));
    const shouldOpen = cards.some((card) => !card.classList.contains("open"));
    cards.forEach((card) => {
        card.classList.toggle("open", shouldOpen);
        card.querySelector(".chev").textContent = shouldOpen ? "收起" : "展开";
    });
    toggle.textContent = shouldOpen ? "收起全部" : "展开全部";
});
</script>
