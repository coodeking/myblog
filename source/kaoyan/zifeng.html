        function addPill(container, text) {
            const span = document.createElement("span");
            span.textContent = text;
            container.appendChild(span);
        }

        function fillList(id, items) {
            const list = document.getElementById(id);
            items.forEach((item) => {
                const li = document.createElement("li");
                li.textContent = item;
                list.appendChild(li);
            });
        }

        addPill(document.getElementById("meta-one"), `目标：${planData.student.target}`);
        addPill(document.getElementById("meta-one"), `年份：${planData.student.exam_year}`);
        addPill(document.getElementById("meta-one"), planData.student.status);
        addPill(document.getElementById("meta-two"), `时间：${planData.student.period}`);
        addPill(document.getElementById("meta-two"), `科目：${planData.student.subjects}`);
        addPill(document.getElementById("meta-two"), `可用时间：${planData.student.hours}`);
        document.getElementById("intro").textContent = planData.overview.intro;
        document.getElementById("strategy").textContent = planData.overview.strategy;
        fillList("materials-list", planData.overview.materials);
        fillList("focus-list", planData.overview.focus);
        fillList("rules-list", planData.overview.rules);

        const weeksRoot = document.getElementById("weeks");
        planData.weeks.forEach((week, index) => {
            const card = document.createElement("article");
            card.className = `week-card${index < 2 ? " open" : ""}`;

            const head = document.createElement("button");
            head.type = "button";
            head.className = "week-head";
            head.setAttribute("aria-expanded", index < 2 ? "true" : "false");
            head.innerHTML = `
                <div>
                    <span class="kicker">WEEK ${String(week.week).padStart(2, "0")}</span>
                    <h3>${week.title}</h3>
                </div>
                <span class="date">${week.date}</span>
                <span class="chev">⌄</span>
            `;

            const body = document.createElement("div");
            body.className = "week-body";

            const msg = document.createElement("div");
            msg.className = "message";
            msg.textContent = week.message;
            body.appendChild(msg);

            const subjects = document.createElement("div");
            subjects.className = "subjects";
            week.cards.forEach((item) => {
                const sub = document.createElement("section");
                sub.className = "subject";
                const title = document.createElement("h4");
                title.textContent = item.name;
                const content = document.createElement("p");
                content.textContent = item.content;
                sub.appendChild(title);
                sub.appendChild(content);
                subjects.appendChild(sub);
            });
            body.appendChild(subjects);

            head.addEventListener("click", () => {
                const isOpen = card.classList.toggle("open");
                head.setAttribute("aria-expanded", isOpen ? "true" : "false");
            });

            card.appendChild(head);
            card.appendChild(body);
            weeksRoot.appendChild(card);
        });

        document.getElementById("toggle-all").addEventListener("click", (event) => {
            const cards = [...document.querySelectorAll(".week-card")];
            const shouldOpen = cards.some((card) => !card.classList.contains("open"));
            cards.forEach((card) => {
                card.classList.toggle("open", shouldOpen);
                const head = card.querySelector(".week-head");
                head.setAttribute("aria-expanded", shouldOpen ? "true" : "false");
            });
            event.currentTarget.textContent = shouldOpen ? "收起全部" : "展开全部";
        });
    </script>
