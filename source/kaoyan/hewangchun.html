<head>

  <style>
    :root {

      min-height: 100vh;
    }
    .container { width: min(1220px, calc(100% - 28px)); margin: 0 auto; padding: 28px 0 44px; }
    header {
      border: 1px solid rgba(120, 80, 38, .22);
      background: rgba(255, 253, 248, .92);
      border-radius: 30px;
      padding: 34px;
      box-shadow: 0 24px 80px var(--shade);
      position: relative;
      overflow: hidden;
    }
    header:before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, rgba(154,90,32,.08), transparent 44%, rgba(29,111,95,.08));
      pointer-events: none;
    }
    header h1 {
      position: relative;
      font-size: clamp(2rem, 5vw, 4rem);
      letter-spacing: -.045em;
      line-height: 1.08;
      margin-bottom: 18px;
    }
    .meta { position: relative; display: flex; flex-wrap: wrap; gap: 10px; color: var(--muted); }
    .meta span { border: 1px solid var(--line); background: rgba(255,255,255,.68); border-radius: 999px; padding: 7px 12px; }
    .panel {
      margin-top: 20px;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: rgba(255, 253, 248, .9);
      padding: 26px;
      box-shadow: 0 16px 52px rgba(88, 52, 19, .08);
    }
    h2 { font-size: 1.4rem; margin-bottom: 12px; }
    .strategy { color: #4e4337; white-space: pre-line; margin: 10px 0; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 18px; }
    .course { border: 1px solid var(--line); border-radius: 20px; background: var(--card); padding: 18px; }
    .course h3 { margin-bottom: 8px; text-align: left; }
    .course ul { padding-left: 18px; color: #4d4439; }
    .course li { margin: 7px 0; }
    .materials h3 { color: var(--blue); }
    .checks h3 { color: var(--brick); }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin: 22px 2px 14px; gap: 12px; color: var(--muted); }
    button {
      font: inherit;
      border: 1px solid rgba(120, 80, 38, .28);
      background: #2b2118;
      color: #fff8ed;
      border-radius: 999px;
      padding: 10px 16px;
      cursor: pointer;
    }
    .weeks { display: grid; gap: 14px; }
    .week-card { border: 1px solid var(--line); border-radius: 24px; background: rgba(255,253,248,.92); overflow: hidden; box-shadow: 0 10px 34px rgba(88,52,19,.08); }
    .week-head { width: 100%; display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center; background: transparent; color: var(--ink); border: 0; border-radius: 0; padding: 18px 20px; text-align: left; }
    .week-head:hover { background: rgba(243,229,210,.55); }
    .kicker { display: block; color: var(--muted); font-size: .82rem; letter-spacing: .08em; }
    .week-head h3 { font-size: 1.1rem; line-height: 1.35; }
    .date { color: var(--muted); white-space: nowrap; }
    .chev { color: var(--muted); transition: transform .18s ease; }
    .week-card.open .chev { transform: rotate(180deg); }
    .week-body { display: none; border-top: 1px solid var(--line); padding: 18px 20px 20px; }
    .week-card.open .week-body { display: block; }
    .message { background: var(--soft); border-left: 4px solid #bf7a36; border-radius: 14px; padding: 14px 16px; margin-bottom: 16px; color: #4b3a28; white-space: pre-line; }
    .subjects { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .subject { border: 1px solid var(--line); border-radius: 18px; background: white; padding: 15px 16px; }
    .subject h4 { margin-bottom: 8px; font-size: 1rem; }
    .subject.chem h4 { color: var(--blue); }
    .subject.major h4 { color: var(--green); }
    .subject.check h4 { color: var(--brick); }
    .subject p { color: #464038; margin-top: 10px; white-space: pre-line; }
    a { color: var(--green); text-decoration-thickness: 1px; text-underline-offset: 3px; }
    footer { text-align: center; color: var(--muted); margin-top: 26px; font-size: .92rem; }
    @media (max-width: 1080px) {
      .grid, .subjects { grid-template-columns: 1fr; }
      .week-head { grid-template-columns: 1fr; }
      .date { white-space: normal; }
      header { padding: 26px; }
    }
  </style>
</head>

    const text = (value) => String(value ?? '');
    const escapeHtml = (value) => text(value)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
    const block = (value) => escapeHtml(value).split(String.fromCharCode(10)).join('<br>');

    function renderList(id, items) {
      const target = document.getElementById(id);
      target.innerHTML = items.map((item) => `<li>${block(item)}</li>`).join('');
    }

    function renderMeta() {
      const s = planData.student;
      document.getElementById('meta-one').innerHTML = [
        s.name,
        s.target,
        s.exam,
        s.subjects
      ].map((item) => `<span>${escapeHtml(item)}</span>`).join('');
      document.getElementById('meta-two').innerHTML = [
        s.period,
        s.hours,
        s.status
      ].map((item) => `<span>${escapeHtml(item)}</span>`).join('');
      document.getElementById('intro').textContent = planData.overview.intro;
      document.getElementById('strategy').textContent = planData.overview.strategy;
      document.getElementById('range').textContent = `${planData.weeks.length}周：${planData.student.period}`;
    }

    function renderWeeks() {
      const target = document.getElementById('weeks');
      target.innerHTML = planData.weeks.map((week, index) => `
        <article class="week-card ${index < 2 ? 'open' : ''}">
          <button class="week-head" type="button" aria-expanded="${index < 2 ? 'true' : 'false'}">
            <div>
              <span class="kicker">第${week.week}周</span>
              <h3>${escapeHtml(week.title)}</h3>
            </div>
            <span class="date">${escapeHtml(week.date)}</span>
            <span class="chev">⌄</span>
          </button>
          <div class="week-body">
            <div class="message">${block(week.message)}</div>
            <div class="subjects">
              <section class="subject chem">
                <h4>315 化学（农）</h4>
                <p>${block(week.chem)}</p>
              </section>
              <section class="subject major">
                <h4>857 农业资源环境概论</h4>
                <p>${block(week.major)}</p>
              </section>
              <section class="subject check">
                <h4>验收和调整</h4>
                <p>${block(week.check)}</p>
              </section>
            </div>
          </div>
        </article>
      `).join('');
      document.querySelectorAll('.week-card').forEach((card) => {
        const button = card.querySelector('.week-head');
        button.addEventListener('click', () => {
          card.classList.toggle('open');
          button.setAttribute('aria-expanded', card.classList.contains('open') ? 'true' : 'false');
        });
      });
    }

    function bindToggle() {
      const button = document.getElementById('toggle-all');
      button.addEventListener('click', () => {
        const cards = [...document.querySelectorAll('.week-card')];
        const shouldOpen = cards.some((card) => !card.classList.contains('open'));
        cards.forEach((card) => {
          card.classList.toggle('open', shouldOpen);
          card.querySelector('.week-head').setAttribute('aria-expanded', shouldOpen ? 'true' : 'false');
        });
        button.textContent = shouldOpen ? '收起全部' : '展开全部';
      });
    }

    renderMeta();
    renderList('materials-list', planData.overview.materials);
    renderList('checks-list', planData.overview.checks);
    renderWeeks();
    bindToggle();
  </script>
