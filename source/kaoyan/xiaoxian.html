<style>
:root{--bg:#f5efe4;--paper:rgba(255,255,255,.93);--ink:#2a2119;--muted:#75695c;--line:#e3d4c0;--accent:#9c5c26;--deep:#1f5f55;--brick:#8d3d22;--soft:#f7eddc;--shadow:0 24px 70px rgba(82,50,22,.13)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;color:var(--ink);font-family:"Noto Serif SC","Microsoft YaHei","PingFang SC",serif;line-height:1.78;background:radial-gradient(circle at 7% 8%,rgba(156,92,38,.15),transparent 30%),radial-gradient(circle at 93% 12%,rgba(31,95,85,.14),transparent 28%),linear-gradient(135deg,#f2dfc4 0%,#fff8ee 48%,#ead2b5 100%)}

.tag{position:relative;display:inline-flex;color:var(--deep);font-weight:800;letter-spacing:.05em;margin-bottom:12px}
h1{position:relative;font-size:clamp(2rem,5vw,4rem);line-height:1.1;letter-spacing:-.04em;margin-bottom:18px;max-width:920px}
.meta{position:relative;display:flex;flex-wrap:wrap;gap:10px;color:var(--muted)}
.meta span{border:1px solid var(--line);background:rgba(255,255,255,.7);border-radius:999px;padding:7px 12px}
.panel{border:1px solid var(--line);border-radius:26px;background:rgba(255,253,248,.9);padding:24px;margin-bottom:20px;box-shadow:0 16px 46px rgba(82,50,22,.08)}
h2{font-size:1.38rem;margin-bottom:12px;letter-spacing:-.02em}
.strategy{border:1px solid rgba(125,82,41,.16);border-radius:18px;background:#fff6e9;padding:15px 17px;color:#43372c;white-space:pre-line;margin-bottom:14px}
.overview{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}
.course{border:1px solid var(--line);border-radius:20px;background:var(--paper);padding:17px;text-align:left;box-shadow:inset 4px 0 0 var(--accent)}
.course:nth-child(2){box-shadow:inset 4px 0 0 var(--deep)}
.course:nth-child(3){box-shadow:inset 4px 0 0 var(--brick)}
.course:nth-child(4){box-shadow:inset 4px 0 0 #7b6a45}
.course h3{font-size:1.02rem;margin-bottom:8px;color:#5a361d}
.course p{color:#474039;font-size:.96rem}
.blocks{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.block{border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,#fffdf8,#f8ecdd);padding:16px;min-height:150px}
.block b{display:block;color:var(--deep);margin-bottom:4px}
.block em{display:block;font-style:normal;color:var(--accent);font-weight:800;margin-bottom:8px}
.block span{color:var(--muted);font-size:.94rem}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:24px 0 15px;color:var(--muted);flex-wrap:wrap}
button{border:0;border-radius:999px;background:#2a2118;color:#fffaf1;padding:10px 17px;cursor:pointer;font:inherit;font-weight:800}
.weeks{display:grid;gap:14px}
.week-card{border:1px solid var(--line);border-radius:24px;background:rgba(255,253,248,.93);overflow:hidden;box-shadow:0 10px 34px rgba(82,50,22,.08)}
.week-card.open{border-color:rgba(156,92,38,.42)}
.week-head{width:100%;display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;background:transparent;color:var(--ink);border:0;border-radius:0;padding:18px 20px;text-align:left}
.week-head:hover{background:rgba(247,237,220,.64)}
.kicker{display:block;color:var(--muted);font-size:.82rem;letter-spacing:.08em}
.week-head h3{font-size:1.08rem;line-height:1.42}
.date{color:var(--muted);white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.9rem}
.chev{color:var(--muted)}
.week-body{display:none;border-top:1px solid var(--line);padding:18px 20px 20px;background:rgba(255,255,255,.38)}
.week-card.open .week-body{display:block}
.week-body p{white-space:pre-line;color:#3f3933;font-size:1rem}
footer{text-align:center;color:var(--muted);margin-top:26px;font-size:.92rem}
@media(max-width:1050px){.overview,.blocks{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.overview,.blocks{grid-template-columns:1fr}.week-head{grid-template-columns:1fr}.date{white-space:normal}.hero{padding:24px}}
</style>
</head>

const setText = (id, text) => { document.getElementById(id).textContent = text; };
setText("title", `${planData.student.name} 2027考研公共课规划`);
setText("target", `目标：${planData.student.target}`);
setText("exam", planData.student.period);
setText("period", `节奏：${planData.student.hours}`);
setText("subject", `科目：${planData.student.subject}`);
setText("intro", planData.overview.intro);
setText("strategy", planData.overview.strategy);
setText("countText", `共 ${planData.weeks.length} 周，默认展开前两周`);

const materials = document.getElementById("materials");
planData.overview.materials.forEach((item, index) => {
    const card = document.createElement("article");
    card.className = "course";
    const titles = ["数学主线", "英语主线", "政治主线", "执行方法"];
    card.innerHTML = `<h3>${titles[index]}</h3><p>${item}</p>`;
    materials.appendChild(card);
});

const blocks = document.getElementById("blocks");
planData.overview.blocks.forEach((item) => {
    const card = document.createElement("article");
    card.className = "block";
    card.innerHTML = `<b>${item[0]}</b><em>${item[1]}</em><span>${item[2]}</span>`;
    blocks.appendChild(card);
});

const weeksNode = document.getElementById("weeks");
planData.weeks.forEach((week, index) => {
    const card = document.createElement("article");
    card.className = `week-card${index < 2 ? " open" : ""}`;
    const head = document.createElement("button");
    head.className = "week-head";
    head.type = "button";
    head.innerHTML = `
        <div>
            <span class="kicker">第${week.week}周 · ${week.phase}</span>
            <h3>${week.title}</h3>
        </div>
        <span class="date">${week.date}</span>
        <span class="chev">${index < 2 ? "收起" : "展开"}</span>
    `;
    const body = document.createElement("div");
    body.className = "week-body";
    const message = document.createElement("p");
    message.className = "strategy";
    message.textContent = week.message;
    const grid = document.createElement("div");
    grid.className = "subjects";
    [
        ["math", "数学一"],
        ["english", "英语一"],
        ["politics", "政治"],
    ].forEach(([cls, title]) => {
        const section = document.createElement("section");
        section.className = `subject ${cls}`;
        const h4 = document.createElement("h4");
        h4.textContent = title;
        const p = document.createElement("p");
        p.textContent = week[cls];
        section.append(h4, p);
        grid.appendChild(section);
    });
    body.append(message, grid);
    head.addEventListener("click", () => {
        card.classList.toggle("open");
        head.querySelector(".chev").textContent = card.classList.contains("open") ? "收起" : "展开";
    });
    card.append(head, body);
    weeksNode.appendChild(card);
});

const toggle = document.getElementById("toggleAll");
toggle.addEventListener("click", () => {
    const cards = Array.from(document.querySelectorAll(".week-card"));
    const shouldOpen = cards.some((card) => !card.classList.contains("open"));
    cards.forEach((card) => {
        card.classList.toggle("open", shouldOpen);
        card.querySelector(".chev").textContent = shouldOpen ? "收起" : "展开";
    });
    toggle.textContent = shouldOpen ? "收起全部" : "展开全部";
});
</script>
</body>
</html>
