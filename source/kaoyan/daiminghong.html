      background: #2b2118;
      color: #fff8ed;
      border-radius: 999px;

    .week-head h3 { font-size: 1.1rem; line-height: 1.35; }

    .week-body { display: none; border-top: 1px solid var(--line); padding: 18px 20px 20px; }

    .message { background: var(--soft); border-left: 4px solid #bf7a36; border-radius: 14px; padding: 14px 16px; margin-bottom: 16px; color: #4b3a28; white-space: pre-line; }

    .subject { border: 1px solid var(--line); border-radius: 18px; background: white; padding: 15px 16px; }

    footer { text-align: center; color: var(--muted); margin-top: 26px; font-size: .92rem; }
    @media (max-width: 980px) {
      .grid, .subjects { grid-template-columns: 1fr; }
      .week-head { grid-template-columns: 1fr; }
      .date { white-space: normal; }
      header { padding: 26px; }

  </style>
</head>

    const NL = String.fromCharCode(10);

    function appendText(target, text) {
      text.split(NL + NL).forEach((part) => {
        const p = document.createElement("p");
        p.textContent = part;
        target.appendChild(p);
      });
    }

    function fillList(id, items) {
      const list = document.getElementById(id);
      items.forEach((item) => {
        const li = document.createElement("li");
        li.textContent = item;
        list.appendChild(li);
      });
    }

    function render() {
      const student = planData.student;
      document.getElementById("meta-one").innerHTML = `
        <span>${student.target}</span>
        <span>${student.exam}</span>
        <span>${student.subjects}</span>
      `;
      document.getElementById("meta-two").innerHTML = `
        <span>${student.hours}</span>
        <span>${student.status}</span>
      `;
      document.getElementById("intro").textContent = planData.overview.intro;
      document.getElementById("strategy").textContent = planData.overview.strategy;
      document.getElementById("range").textContent = `共 ${planData.weeks.length} 周，从 ${student.start_cn} 排到 ${student.exam_cn}。`;
      fillList("english-list", planData.overview.english);
      fillList("politics-list", planData.overview.politics);

      const weeks = document.getElementById("weeks");
      planData.weeks.forEach((week, index) => {
        const card = document.createElement("article");
        card.className = `week-card${index < 2 ? " open" : ""}`;

        const head = document.createElement("button");
        head.type = "button";
        head.className = "week-head";
        head.innerHTML = `
          <div>
            <span class="kicker">第 ${week.week} 周</span>
            <h3>${week.title}</h3>
          </div>
          <span class="date">${week.date}</span>
          <span class="chev">⌄</span>
        `;

        const body = document.createElement("div");
        body.className = "week-body";

        const message = document.createElement("div");
        message.className = "message";
        message.textContent = week.message;
        body.appendChild(message);

        const subjects = document.createElement("div");
        subjects.className = "subjects";

        const english = document.createElement("section");
        english.className = "subject english";
        english.innerHTML = "<h4>英语二</h4>";
        appendText(english, week.english);
        subjects.appendChild(english);

        const politics = document.createElement("section");
        politics.className = "subject politics";
        politics.innerHTML = "<h4>政治</h4>";
        appendText(politics, week.politics);
        subjects.appendChild(politics);

        body.appendChild(subjects);
        head.addEventListener("click", () => card.classList.toggle("open"));
        card.appendChild(head);
        card.appendChild(body);
        weeks.appendChild(card);
      });

      document.getElementById("toggle-all").addEventListener("click", (event) => {
        const cards = [...document.querySelectorAll(".week-card")];
        const shouldOpen = cards.some((card) => !card.classList.contains("open"));
        cards.forEach((card) => card.classList.toggle("open", shouldOpen));
        event.currentTarget.textContent = shouldOpen ? "收起全部" : "展开全部";
      });
    }

    render();
  </script>
