<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高宇宸 2026年12月初试公共课规划</title>
    <style>
        :root {
            --paper: #fffaf1;
            --ink: #282018;
            --muted: #756c60;
            --line: #e8dbc9;
            --math: #b45309;
            --english: #0f766e;
            --politics: #7c2d12;
            --soft: #f4eadb;
            --card: #fffdf8;
            --shadow: 0 22px 70px rgba(95, 62, 30, .12);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            color: var(--ink);
            background:
                radial-gradient(circle at 8% 8%, rgba(180, 83, 9, .15), transparent 30%),
                radial-gradient(circle at 92% 12%, rgba(15, 118, 110, .13), transparent 27%),
                linear-gradient(135deg, #f6e8d5 0%, #fffaf1 48%, #eedcc4 100%);
            font-family: "Noto Serif SC", "Microsoft YaHei", "PingFang SC", serif;
            line-height: 1.78;
        }
        .container { width: min(1120px, calc(100% - 28px)); margin: 0 auto; padding: 28px 0 44px; }
        header {
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(120, 80, 38, .22);
            border-radius: 30px;
            background: rgba(255, 253, 248, .88);
            box-shadow: var(--shadow);
            padding: 34px;
            margin-bottom: 20px;
        }
        header:before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(112deg, rgba(180,83,9,.08), transparent 45%, rgba(15,118,110,.08));
            pointer-events: none;
        }
        h1 { position: relative; max-width: 900px; font-size: clamp(2rem, 5vw, 3.8rem); letter-spacing: -.04em; line-height: 1.1; margin-bottom: 18px; }
        .meta { position: relative; display: flex; flex-wrap: wrap; gap: 10px; color: var(--muted); }
        .meta span { border: 1px solid var(--line); background: rgba(255,255,255,.65); border-radius: 999px; padding: 7px 12px; }
        .panel {
            border: 1px solid var(--line);
            border-radius: 26px;
            background: rgba(255, 253, 248, .88);
            padding: 26px;
            margin-bottom: 20px;
            box-shadow: 0 16px 52px rgba(88, 52, 19, .08);
        }
        h2 { font-size: 1.36rem; margin-bottom: 12px; }
        .strategy {
            border: 1px solid rgba(120, 80, 38, .16);
            border-radius: 18px;
            background: #fff7ec;
            padding: 15px 17px;
            color: #42372c;
            white-space: pre-line;
            margin-bottom: 14px;
        }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 16px; }
        .course { border: 1px solid var(--line); border-radius: 20px; background: var(--card); padding: 18px; text-align: left; }
        .course h3 { margin-bottom: 10px; font-size: 1.04rem; }
        .course.math { box-shadow: inset 4px 0 0 var(--math); }
        .course.english { box-shadow: inset 4px 0 0 var(--english); }
        .course.politics { box-shadow: inset 4px 0 0 var(--politics); }
        .course.math h3 { color: var(--math); }
        .course.english h3 { color: var(--english); }
        .course.politics h3 { color: var(--politics); }
        ul { padding-left: 20px; }
        li { margin-bottom: 9px; color: #463d34; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin: 24px 0 15px; color: var(--muted); flex-wrap: wrap; }
        button {
            border: 0;
            border-radius: 999px;
            background: #2a2118;
            color: #fffaf1;
            padding: 10px 17px;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
        }
        .weeks { display: grid; gap: 14px; }
        .week-card {
            border: 1px solid var(--line);
            border-radius: 24px;
            background: rgba(255,253,248,.92);
            overflow: hidden;
            box-shadow: 0 10px 34px rgba(88,52,19,.08);
        }
        .week-card.open { border-color: rgba(180,83,9,.35); }
        .week-head {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 14px;
            align-items: center;
            background: transparent;
            color: var(--ink);
            border: 0;
            border-radius: 0;
            padding: 18px 20px;
            text-align: left;
        }
        .week-head:hover { background: rgba(244,234,219,.55); }
        .kicker { display: block; color: var(--muted); font-size: .82rem; letter-spacing: .08em; }
        .week-head h3 { font-size: 1.08rem; line-height: 1.42; }
        .date { color: var(--muted); white-space: nowrap; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .9rem; }
        .chev { color: var(--muted); transition: transform .18s ease; }
        .week-card.open .chev { transform: rotate(180deg); }
        .week-body { display: none; border-top: 1px solid var(--line); padding: 18px 20px 20px; }
        .week-card.open .week-body { display: block; }
        .message { background: var(--soft); border-left: 4px solid #c17f40; border-radius: 14px; padding: 14px 16px; margin-bottom: 16px; color: #4b3a28; white-space: pre-line; }
        .subjects { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
        .subject { border: 1px solid var(--line); border-radius: 18px; background: white; padding: 15px 16px; }
        .subject h4 { margin-bottom: 8px; font-size: 1rem; }
        .subject.math h4 { color: var(--math); }
        .subject.english h4 { color: var(--english); }
        .subject.politics h4 { color: var(--politics); }
        .subject p { white-space: pre-line; color: #464038; }
        footer { text-align: center; color: var(--muted); margin-top: 26px; font-size: .92rem; }
        @media (max-width: 980px) {
            .grid, .subjects { grid-template-columns: 1fr; }
            .week-head { grid-template-columns: 1fr; }
            .date { white-space: normal; }
        }
    </style>
</head>

    "strategy": "核心原则：所有科目都不准当耐听王，多想多算多做，落实到笔头。公共课内部大致按数学60%、英语30%、政治10%来分，不把每天时间排满，给开学课程和其他任务留余量。\n\n数学二只按高数和线代安排。你现在的数学目标是80-90，不需要把难题、怪题、习题册证明题当主线。前6周先把武忠祥高数讲义二刷的漏项、多元微分、二重积分、喻老线代强化第一章和后续章节补扎实；高数基础700题继续用，但做题速度慢就按“少量、写全、订正清楚”来，不用和网上进度比。张宇《基础30讲》课后题和《1000题》基础A组作为同类基础题补充，不再新开很多资料。澄箫宇大观用来补题型入口，660一阶题练选填反应，于文涛《真题一本通》从9月后半段开始放到主线，后期再做数二真题套卷和少量李林6+4。\n\n英语按你现在的进度接着走。先把不背单词里剩下的170个左右收完，后面每天20个新词加复习清零，不再强行扩完整大纲词。阅读继续做英语二真题，不做整篇细翻，改成题干定位、同义替换、错题原因、影响做题的长句这几件事。作文从9月下旬开始用Monkey模板慢慢准备。\n\n政治10月正式开始。9月只看苏一思维导图或目录，知道框架即可。10月以后用腿姐冲刺背诵手册、苍盾小程序、澄箫宇政治一页纸，12月肖四出来后背主观题框架。政治目标50-55，重点是选择题不要空着，大题会按材料组织话。",

  "weeks": [
    {

      "message": "第一周不要拿自己的速度和网上那种四天一大章的进度比。你线代强化第一章四天才过完，这不算问题，真正的问题是听完以后题目还是没入口。所以这周先把“看过”和“会写”分开：看懂讲义不算完成，合上书能写出第一步，才算真的往前走。周四按休息处理，不补新课，最多把错题照片整理一下、单词复习清零。\n\n本周验收不用看总时长，看三份东西有没有做出来：线代第一章错题页、多元和二重积分入口页、2011阅读错因表。上午如果走神，就把任务切成45分钟一段，中间接水走动5分钟，回来继续写题，不把休息算成学习时间。",

        function makeSubject(name, cls, body) {
            const article = document.createElement("article");
            article.className = `subject ${cls}`;
            const h4 = document.createElement("h4");
            h4.textContent = name;
            const p = document.createElement("p");
            p.textContent = body;
            article.appendChild(h4);
            article.appendChild(p);
            return article;
        }

        const weeksNode = document.getElementById("weeks");
        planData.weeks.forEach((week, index) => {
            const card = document.createElement("article");
            card.className = `week-card${index < 2 ? " open" : ""}`;
            card.dataset.week = String(week.week);

            const head = document.createElement("button");
            head.className = "week-head";
            head.type = "button";

            const titleWrap = document.createElement("span");
            const kicker = document.createElement("span");
            kicker.className = "kicker";
            kicker.textContent = `第 ${week.week} 周`;
            const h3 = document.createElement("h3");
            h3.textContent = week.title;
            titleWrap.appendChild(kicker);
            titleWrap.appendChild(h3);

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = week.date;
            const chev = document.createElement("span");
            chev.className = "chev";
            chev.textContent = "⌄";

            head.appendChild(titleWrap);
            head.appendChild(date);
            head.appendChild(chev);

            const body = document.createElement("div");
            body.className = "week-body";
            const message = document.createElement("div");
            message.className = "message";
            message.textContent = week.message;
            const subjects = document.createElement("div");
            subjects.className = "subjects";
            subjects.appendChild(makeSubject("数学二", "math", week.math));
            subjects.appendChild(makeSubject("英语二", "english", week.english));
            subjects.appendChild(makeSubject("政治", "politics", week.politics));
            body.appendChild(message);
            body.appendChild(subjects);

            head.addEventListener("click", () => card.classList.toggle("open"));
            card.appendChild(head);
            card.appendChild(body);
            weeksNode.appendChild(card);
        });

        const toggle = document.getElementById("toggleAll");
        toggle.addEventListener("click", () => {
            const cards = Array.from(document.querySelectorAll(".week-card"));
            const shouldOpen = cards.some(card => !card.classList.contains("open"));
            cards.forEach(card => card.classList.toggle("open", shouldOpen));
            toggle.textContent = shouldOpen ? "收起全部" : "展开全部";
        });
