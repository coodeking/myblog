<style>
:root {

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;line-height:1.78}
.wrap{max-width:1080px;margin:0 auto;padding:28px 18px 56px}

.overview-card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:19px 20px;box-shadow:0 5px 15px rgba(31,48,59,.04)}

.overview-card.main{grid-column:1/-1;border-left:5px solid var(--navy)}
.overview-card.math{border-top:4px solid var(--blue)} .overview-card.english{border-top:4px solid var(--green)}
.overview-card.politics{border-top:4px solid var(--gold)} .overview-card.major{border-top:4px solid var(--teal)}
.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:28px 0 13px}
.controls button{border:1px solid #c6d1d2;background:#fff;color:var(--navy);border-radius:9px;padding:8px 13px;cursor:pointer;font-weight:600}

.dates{white-space:nowrap;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.week-body{display:none;padding:0 20px 20px;border-top:1px solid var(--line)}
.week.open .week-body{display:block}

.subject{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff}

.subject.english{border-left:5px solid var(--green)} .subject.english h4{color:var(--green)}
.subject.politics{border-left:5px solid var(--gold)} .subject.politics h4{color:#9a681e}
.subject.major{border-left:5px solid var(--teal)} .subject.major h4{color:var(--teal)}
footer{margin-top:30px;color:#7a838b;text-align:center;font-size:13px}
@media(max-width:760px){.wrap{padding:16px 11px 40px}.hero{padding:28px 22px}.overview,.subjects{grid-template-columns:1fr}.overview-card.main{grid-column:auto}.week-head{align-items:flex-start;flex-direction:column;gap:3px}.dates{white-space:normal}}
</style>

<script>
const plan = {"name": "唐", "target": "电子科技大学 · 电子信息科学与技术（085400）", "special": "退役大学生士兵计划", "exam": "2026年12月20日初试", "period": "2026.09.22 - 2026.12.20，共13周", "subjects": "数学一 / 英语一 / 政治 / 858信号与系统", "hours": "公共课约6-8小时，858约2-4小时，按当天状态调整", "overview": {"main": "这份安排从2026年9月22日开始，到2026年12月20日初试结束，共13个实际周。你走电子科技大学退役大学生士兵计划，目标总分按350分安排，先按数学一110、858信号与系统110、英语一70、政治60来分配精力。每天总学习时间按8到10小时估计，其中公共课内部大致按数学60%、英语30%、政治10%分配，858另外每天留出2到4小时。当天做不完时，先保留限时题、真题订正、单词和政治选择题，别把时间都用在听课上。", "math": "数学一的主线是张宇《基础30讲》、1000题、880题、数一分类真题和真题册。30讲、例题和课后题已经过了一遍，后面不再从头听张宇课程；不懂的知识点再按错题去看短视频，B站可以搜千羽、考研数学777、没咋了的1000题讲解。澄箫宇“大观”可以两天一个，先暂停自己做，再听讲解。660一阶题按速刷处理，单题两分钟没思路就跳过。真题优先于习题册，真题错题本单独按章节整理；《真题一本通》——于文涛如果手里已有，就用来做分类框架，没有就沿用现在的数一真题。所有习题册和模拟卷不做证明题，只写真题证明题。张宇的超实数、微分算子法、海涅定理、压缩映射原理、stolz不放进本次计划。", "english": "英语一继续使用不背单词、真题伴侣、《考研真相》和《句句真研》。单词已经完成6200词和1000短语第三轮，后面不再扩大资料范围，重点看真题里的熟词新义。阅读已经过完1998—2023年一轮，第二轮只处理错题、定位句和选项改写，不做全文精翻，不买手译本。新题型已经过完2005—2023年一轮，排序题单独处理段落关系。作文先把石雷鹏小作文课程完成；大作文只选一套自己写得出来的模板，如果要看Monkey就只取一套，不同时跟多个老师。", "politics": "政治已经跟完徐涛核心考案前5章并做过肖1000题一部分，后面不再扩展长课，也不把肖1000题作为主线。改用腿姐《冲刺背诵手册》熟读、苍盾VIP每天30道选择题、澄箫宇政治一页纸和红果研命题点框图。肖八、肖四什么时候拿到就什么时候按计划接上，肖四出来后直接背主观题。政治每天控制在40到90分钟，目标是选择题稳定、主观题有关键词可写，不和数学、858抢整块时间。", "major": "858以何子述《信号与系统》为主教材，奥本海姆版作为概念对照，配合成都电子科技大学858历年真题和余哥计算专项300题。何子述第1至7章依次按信号与系统基本概念、连续时间系统时域分析、连续时间信号频域分析、连续时间系统频域分析、连续时间系统复频域分析、离散时间系统时域分析、第7章Z变换和离散系统变换域分析来安排。已有真题按两天一套：第一天限时写，第二天讲解和同类题；四套后用三天整理章节和错题。奥本海姆不整本并行精读，只查何子述中不清楚的内容。"}, "weeks": [{"week": 1, "dates": "2026.09.22 - 2026.09.28", "title": "先把四次真题里的薄弱点处理完", "note": "这周先按文档里已经排好的节奏走。9月23日看完2018年真题讲解，9月24日至26日集中处理错题，别再同时开新课。你现在不是没有做过题，而是线面积分、多重积分、联合分布、二次型和计算细节没有稳定下来。每天把能动笔的任务放在前面，视频只用来解决具体问题。", "math": "数学一先完成2018年真题喻老讲解，讲解过程中把每道错题贴回对应章节。9月24日专门做正交变换和二次型：先回张宇《基础30讲》线代对应部分，再从880综合题和数一分类真题中选15到20题，重点看特征值、特征向量和正交矩阵之间怎么对应。9月25日做多重积分、二重积分和线面积分，二重积分先画区域再列限，空间曲线和曲面积分先判断能否用参数式、投影或性质，不要一看到就套公式。9月26日处理联合分布、边缘分布和独立性判断，离散变量写分布律，连续变量写联合密度和边缘密度，再用具体范围验证。每天另做20道1000A或880基础题，速度慢的题先写第一步，两个小时没有入口就看解析。晚上把当天错题按“考哪一章、第一步是什么、错在计算还是判断”记在数一错题本里。数学知识汇总笔记只翻当天对应的页，不从头再看一遍。\n\n周末看一下：把2015至2018年四套卷里反复错的题号写在错题本首页，按高数、线代、概率分成三栏；每栏只留下最值得重做的题，不要把整套答案搬过去。", "english": "英语一保持每天单词和一篇真题阅读。用不背单词继续清掉6200词和1000个短语的第三轮，不重新开一本词书，复习时间控制在30到40分钟。阅读从已经做过的2015到2018年里挑错得多的文章重看，每天一篇，先自己说出文章主线，再对照唐迟阅读方法论检查定位句、同义替换和错误选项。不要全文精翻，也不买手译本，只把错题所在句和前后两句读顺。小作文接着看石雷鹏精讲，完成第3个视频到本阶段末，按书信、通知、建议信的格式各写一篇，先把称呼、目的、分点和落款写完整。完型和翻译暂时只保留每天10分钟熟悉题型，不占用数学和858的整块时间。\n\n周末看一下：把本周阅读中错过的选项再遮住重选一次；如果第二次能选对，只在题旁写清原文依据，不再重复抄文章。", "politics": "政治先不再往徐涛长课后面开新章节。把已经看过的前5章配合肖1000题做过的163道单选、157道多选整理一下，周内用苍盾VIP每天30道选择题，错题只记一个关键词和所属板块。准备腿姐《冲刺背诵手册》，从下周开始换成短时间熟读；红果研2026命题点框图先用来认目录，不要求今天背完。晚上读澄箫宇政治一页纸的马原部分10分钟，把唯物论、辩证法、认识论分别在问什么说清楚。\n\n周末看一下：把苍盾错题里真正因为概念不熟而错的题圈出来，时政陌生题只做标记，不为一道题写很长的笔记。", "major": "858先不急着做整套。9月22日至23日完成何子述版教材第7章剩下的综合习题，遇到Z变换收敛域、序列变换和系统函数题，先在题旁标出对应小节。9月24日至25日用两天把何子述第1至7章的目录、核心公式和常见题型过一遍：第1章信号与系统基本性质，第2章连续时间系统时域分析，第3章连续时间信号频域分析，第4章连续时间系统频域分析，第5章拉普拉斯变换，第6章离散时间系统时域分析，第7章Z变换和离散系统变换域分析。9月26日至28日从余哥计算专项300题中选第7章和第5章各10题，写完后把每题贴回教材页码。奥本海姆本周只查自己在何子述书上看不懂的概念，不要整章并行阅读。周末整理一张858题型表，先分填空、简答、画图、计算、证明。\n\n周末看一下：858七章表里每章至少写出一个常见题型和一个容易漏的条件，特别是第7章收敛域、第5章初值条件和第2章卷积积分区间。"}, {"week": 2, "dates": "2026.09.29 - 2026.10.05", "title": "开始两天一套真题，英语把作文主线立起来", "note": "从这周开始按一套题两天处理，不要一边做卷一边临时换资料。每套题做完都要留下错题和原因，分数只是用来观察问题，不用拿某一年卷子的分数吓自己。", "math": "数学一开始做真题册里2019年整套卷：第一天按考试时间限时完成，证明题只写真题里的证明题，做完当天标出不会、会但算错、会但超时三类；第二天看喻老讲解或对应解析，重点重算错题。2019年卷里遇到线积分、二次型、联合分布和多重积分，就从880综合题或数一分类真题各选5题做同类练习。完成2019年后用两天处理2020年卷，最后一天翻知识点汇总笔记，把本周两套卷涉及的公式和容易看错的位置写到一页纸上。每天保留15道1000A或660一阶题，660按速刷做，单题两分钟没有思路就先跳过，对答案后再看第一步。不要把880综合部分整本打开，只做真题暴露出来的专题。\n\n周末看一下：2019和2020两套卷分别记下完成时间、选择填空错题数、大题卡住的位置。下一周的专项题只按这份记录选，不按题册顺序乱做。", "english": "英语一每天继续清空不背单词复习量，新增内容只按软件安排，不再追求一天塞很多新词。阅读做2019年和2020年各两篇，第一天限时，第二天订正，每道错题写出原文定位句和选项错在哪里。新题型开始第二轮，先做排序题，选项先看代词、时间词、重复名词和段落首尾，不凭语感硬排。小作文完成石雷鹏第4至第6个视频，整理一个通用开头、一个说明问题的中间段和一个结尾；本周手写2篇，一篇建议信、一篇道歉信，写完只检查格式、时态、单复数和拼写。大作文先看图表作文的基本结构，写出自己的三段式提纲，不急着背长句。\n\n周末看一下：两篇阅读各写一句文章主旨和三处定位句；作文把自己反复写错的时态和拼写单独列出，下一篇写完先检查这两项。", "politics": "政治从腿姐《冲刺背诵手册》马原部分开始，每天25到30分钟，按唯物论、辩证法、认识论、历史唯物主义的顺序读；徐涛核心考案只查已经学过的页，肖1000题不再按题量往后做。苍盾VIP每天30道选择题，周末把本周错题按马原、史纲、毛中特、思修标记。政治一页纸每天读一小段，读完合上书说出三个关键词。\n\n周末看一下：腿姐手册读过的内容不要只划线，合上书口头说一遍唯物论和辩证法的关系，能说出大框架就接着往后读。", "major": "本周做858真题册中的2015年真题，第一天限时写完整卷，第二天逐题讲解。第一天做题时把每题标为第1至7章中的哪一章，不会的地方先留白，第二天看解析时在何子述教材里找到原位置。做完后从余哥计算专项300题中选10到15题，优先练卷中出现的卷积、傅里叶变换、拉普拉斯或Z变换计算。对于奥本海姆里的连续时间系统、卷积和频域分析，只有在何子述解释不清时看对应节。周末做一次8题小练习：2道定义与性质、2道卷积、2道傅里叶、1道拉普拉斯、1道Z变换。\n\n周末看一下：2015年真题每道题旁边都写一个教材章节号，统计自己在定义、卷积、频域、变换域四类题中哪类停留时间最长。"}, {"week": 3, "dates": "2026.10.06 - 2026.10.12", "title": "第二套真题后做四套题的小总结", "note": "这周数学和858都要继续写题，不能因为看讲解就把动笔时间拿掉。到了周末，前面四次公共课真题和两次858真题都要留下可回看的记录。", "math": "本周处理数学一2020年、2021年两套真题，仍然是一天限时、一天讲解和重做。2020年重点看极限、二重积分、矩阵方程组和概率分布；2021年重点看幂级数、方向导数、秩1矩阵和随机变量函数分布。每套卷订正完，从1000B中挑与真题同章节的基础题，不追数量，数学每天20题左右即可。周末安排三天总结前面2019至2022年四套卷：第一天只翻数一知识点汇总笔记，把四套题考到的章节做一张表；第二天做多重积分、二类线积分、行列式和矩阵解的讨论各8题；第三天做联合分布、随机变量函数、二次型和幂级数各8题，并把仍然错的题贴进错题本。计算错误要单独记，不要只记知识点。\n\n三天总结结束时，拿2019至2022年的错题各抽一道，合计4道，在不看笔记的情况下重做。做不出的题先写已知条件和第一步，再回看解析，不把时间用在发呆上。", "english": "英语一做2021年和2022年阅读二刷，每天两篇，要求先写出每段作用，再做题。对照真题伴侣把不熟的词标出来，单词只记在当年文章的意思，不要再另建大词表。新题型继续排序和小标题，做2014至2016年中错过的题；翻译开始2015、2016年，每天一小段，先划主干、再处理从句和非谓语，中文表达清楚就可以。小作文写邀请信和感谢信各一篇，石雷鹏课程看到对应部分即可。大作文本周开始准备2个图表开头和2个原因段，用自己的普通句子写，不要和小作文课程混在一起。\n\n本周末把2014至2016年做过的新题型错题重新排一次，并说明每个段落为什么接在前面；这样比再听一遍方法课更容易发现排序题的问题。", "politics": "政治完成腿姐手册史纲前半：鸦片战争到新文化运动、五四运动和中国共产党成立。每天苍盾30道，错题回手册对应页；肖1000题只保留已经做过的题用来回看，不再成为每天的主任务。澄箫宇政治一页纸读史纲时间线，能说清洋务运动、戊戌变法、辛亥革命和五四运动的先后与主要内容。周末把政治错题数量统计一次，找出最容易混的两个板块。\n\n把史纲时间线写在一张纸上，至少能顺着说到五四运动、建党、土地革命和抗战；说不出的节点回腿姐手册看对应段落。", "major": "本周处理858真题册中的2016年和2017年真题，两套各用两天。2016年重点订正卷积、系统性质、傅里叶级数和拉普拉斯；2017年重点订正抽样或离散序列、差分方程、Z变换和系统稳定性。两套做完后用三天总结：第一天翻何子述第1至4章，第二天翻第5章并做余哥计算专项300题中10题，第三天翻第6至7章并做10题。每道错题都写“输入信号是什么、要求哪个响应、应该先选哪种方法”。如果遇到证明题，只看证明链条和使用的条件，不把答案全文抄下来。\n\n三天总结结束时，把2016、2017年真题里的错题各挑三道重写，检查卷积区间、初值条件、收敛域和系统稳定性是否写完整。"}, {"week": 4, "dates": "2026.10.13 - 2026.10.19", "title": "继续两天一套，完成第一轮真题的四年总结", "note": "这周把真题的处理方式固定下来。分数不稳定很正常，重要的是知道失分来自哪里。公共课和858都按先做、再讲、再做同类题的顺序，不要只看视频。", "math": "数学一处理2022年和2023年两套真题。2022年限时后，重点订正积分计算、线面积分、特征值和概率大题；2023年重点看微分方程、幂级数、曲面积分、二次型和联合分布。每套卷第二天看讲解时，自己先把错题重算一遍，再看视频。剩余三天做一次专项：从880综合题中选多重积分10题、线面积分10题、二次型10题、联合分布10题；从1000B选计算容易错的题15题。每道题做完都检查负号、积分上下限、矩阵行列式和概率范围。张宇强化36讲本周只按错题查一两个小节，不整段听课。\n\n周末把880综合题中仍然算错的题再次做一遍，做完不看答案，专门检查积分上下限、矩阵展开、概率取值范围和最后一步化简。四类都能写出基本步骤后再继续下一套真题。", "english": "英语一做2023年阅读和2017至2018年阅读错题二刷。阅读订正写三项：原文定位句、正确选项换了什么说法、错误选项扩大了哪个范围。新题型做2017至2019年排序题，做完把每个选项与前后段的连接词圈出来。翻译做2017年一篇；完型开始做2010、2011年各一套，先不要追求很高的正确率，整理固定搭配和代词指代。作文继续石雷鹏小作文，完成投诉信、通知各一篇；大作文写2019年图表作文一篇，限定40分钟，写完用真题伴侣或句句真研查明显语法问题。\n\n本周作文结束后，把小作文五种常见格式各写一行开头和结尾；大作文只保留自己能稳定写出的句子，不为追求高级表达临时换模板。", "politics": "政治读腿姐手册史纲后半和毛中特开头，重点是北伐、土地革命、抗日战争、解放战争、新民主主义革命和社会主义改造。苍盾每天30题，周末专门看错得多的史纲题。红果研命题点框图用来把史纲和毛中特的时间线接起来，不抄长笔记。政治一页纸读完史纲部分，合上后按时间顺序说出五四、建党、土地革命、抗战、解放战争。\n\n把毛中特本周读过的几个阶段按时间线串起来，苍盾错题只回到书里找对应原句。政治现在要的是熟悉题目表述，不是做一本厚厚的摘抄本。", "major": "本周做858真题册中的2018年和2019年真题。每套卷第一天限时完成，第二天看讲解和整理；四套真题总结已经做完后，本周第三个学习块专门做余哥计算专项300题中卷积、傅里叶、拉普拉斯、Z变换各5题。何子述教材第3章和第5章要回看公式推导，但不要把奥本海姆从头读。周末写一份858答题步骤清单：定义题先写条件，画图题标坐标和关键点，卷积题先写积分区间，变换题先说明收敛域或初始条件，综合题按小问顺序写。\n\n周末把2018、2019年真题按题型统计，看看填空和简答是否丢在概念表述，计算题是否丢在方法选择。以后每套卷都按同一张表记录。"}, {"week": 5, "dates": "2026.10.20 - 2026.10.26", "title": "把剩余近年真题做完一轮，英语开始按题型分块", "note": "到这里资料已经够用了，不再临时找新的课程。哪一科当天状态差，就先完成限时真题或错题重做，剩下的任务按第二天接着做。", "math": "数学一做2024年和2025年真题，若手里的真题册还没有2025年，就用最近一套完整模拟代替，不额外买题。2024年重点看综合计算和概率，2025年重点看线代大题、高数综合题和计算准确率。两套卷每套仍然两天处理，做题时严格写完整步骤。随后用三天完成2019至2025年错题第一次压缩：第一天按高数章节分为极限、导数、积分、多元、微分方程、级数；第二天按线代分为矩阵、向量、方程组、特征值、二次型；第三天按概率分为分布、数字特征、二维随机变量、统计量。每类挑3到5道最能代表问题的题，重做后写出第一步。1000B和880综合只从这些类别里取题，不再平均铺开。\n\n周末把2019至2025年真题里重复出现的题型标星，下一轮只先做标星题和自己错过的题。已经连续两次做对的题暂时放下，给线面积分、二次型和联合分布留时间。", "english": "英语一把阅读二刷推进到2019至2023年，按照两天一组处理：第一天做两篇限时和定位，第二天订正并回看真题伴侣生词。完型做2012、2013年，翻译做2018年。新题型做2020、2021年，排序题先做段落关系图再选。作文完成石雷鹏小作文精讲第一轮，把建议信、道歉信、投诉信、邀请信、通知整理成一张格式表；本周写3篇小作文和1篇大作文，作文不追求难词，先保证句子完整。\n\n把2019至2023年阅读二刷中仍然错的题按定位错误、句子没读懂、选项偷换三类归档，后面每周只回看这三类，不再重复刷已经稳定的文章。", "politics": "政治读毛中特主要章节，顺着腿姐手册把新民主主义革命、社会主义改造、社会主义建设探索、改革开放和新时代中国特色社会主义的基本线索看完。苍盾每天30题，错题回看命题点框图；不要再把时间花在肖1000题新题上。每周末做一次60题小测，记录马原、史纲、毛中特各错多少道，不抄整段解析。\n\n周末做60道选择题后算一下四个板块正确率，低于一半的部分下周每天多读10分钟，高于一半的部分保持苍盾练习即可。", "major": "本周做858真题册中的2020年和2021年真题。2020年重点看连续系统时域与频域综合，2021年重点看离散系统、差分方程和Z变换。每套真题第二天都从余哥计算专项300题找10题同类题，优先做自己写错的类型。何子述第6、7章要在周末回看一遍，尤其是序列移位、卷积和、单位阶跃序列、Z变换收敛域、由系统函数判断因果和稳定。奥本海姆对应内容只看概念解释。\n\n周末用半小时口头讲一遍第1至7章，讲到哪一章卡住就回教材看哪一页。讲完再从300题中各选一题验证，不要只凭“看过”判断会不会。"}, {"week": 6, "dates": "2026.10.27 - 2026.11.02", "title": "第一轮真题完成后，开始错题第二次处理", "note": "这周不再追求每天做很多新题，重点是让已经错过的题重新写出来。看懂解析不等于会做，题目至少要在纸上重写一次。", "math": "数学一用三天做第一轮错题第二次处理：一天高数计算，一天线代，一天概率。高数先做多重积分、线面积分、微分方程和级数各8题；线代做行列式递推、矩阵解的讨论、秩1矩阵、二次型各8题；概率做混合型分布独立性、随机变量函数分布、二维分布各8题。剩余时间做早年真题2015至2018中第一次错过的选择填空，每天一套选填，不再重做已经稳定的题。用数学知识汇总笔记检查公式，不会的知识点再看张宇强化36讲或B站高播放讲解。660一阶题继续每天15到20题，两分钟没有思路就跳过。\n\n本周结束时，把第一轮真题错题表压成一页章节清单，清单上只写题型和入口，例如“二重积分先画区域”“联合分布先写联合和边缘”。第二轮重做按清单走。", "english": "英语一开始把二刷改成按题型处理。阅读做2019至2020年错题，每天4篇中的2篇，重点看选项范围、因果、态度和指代；新题型做2022至2023年，排序错题每道写前后段的连接理由。完型做2014、2015年，翻译做2019年。作文听完石雷鹏小作文课程，开始听或整理大作文常用结构；如果想换Monkey，只选择其中一套，不同时跟两套模板。大作文写2020年图表一篇，小作文写申请信一篇，写后只改低级语法和格式。\n\n本周作文写完后，把模板放到真题伴侣里默写一次，默写时发现不会的句子直接改成自己会写的短句。英语作文先保证完整、清楚、少错。", "politics": "政治开始第二轮读腿姐手册，马原和史纲各用三天重新过一遍。苍盾每天30道保持，周末做一套模拟选择题并把错题分成概念错、时间线错、时政陌生三类。政治一页纸继续每天10分钟，不追求一次背完。徐涛课程到这里不再扩展，已有笔记只在错题对应位置查。\n\n政治一页纸读完后，把马原、史纲、毛中特、思修四个板块各写三到五个关键词，后面做苍盾时用这些关键词定位错题。", "major": "本周做858真题册中的2022年真题，第一天完整限时，第二天逐题解析，第三个学习块做300题中与该卷相同的章节。剩余时间开始第一轮真题错题表：按第1章基本概念、第2章时域、第3章傅里叶、第4章频域、第5章拉普拉斯、第6章离散时域、第7章Z变换分栏。每栏先放5道最有代表性的题。周末用何子述教材把第1至7章公式过一遍，写出卷积、傅里叶变换、拉普拉斯、Z变换的适用条件和常用性质。\n\n把2015至2022年真题中最常出现的卷积、傅里叶、拉普拉斯和Z变换题各留三道，作为后面每周固定重做的典型题，其他相似题不全部抄写。"}, {"week": 7, "dates": "2026.11.03 - 2026.11.09", "title": "进入第二轮近年真题，政治选择题保持每天做", "note": "从这周起题目会更像正式考试，做题时要控制时间，也要控制情绪。遇到看过但没想起来的题，先标记，做完整套再回头处理。", "math": "数学一第二轮做2019、2020年真题，每套压缩到一天半：上午或下午限时完成，第二天先重做错题再看讲解。第二轮不抄完整解答，只把错因和第一步写在错题旁。每套卷后各做高数综合5题、线代综合5题、概率综合5题，检查是否能在3分钟内找到入口。开始看武忠祥选填技巧课中与极限、积分、线代和概率有关的部分，每次不超过30分钟，看完马上拿2道题验证。李林6+4如果已经有，就先不急着全套做；没有就继续使用手中真题和错题，不为买资料影响复习。\n\n周末检查第二轮2019至2022年真题，统计每套卷选择填空和大题分别错在哪里。若同类计算连续错两次，下一周先做该题型的5道基础题，不马上去看难题。", "english": "英语一做2021、2022年整套客观题，阅读控制在每篇18到20分钟，新题型和完型放在同一套卷里做。第二天订正时用真题伴侣标记仍然不熟的词，只背文章里的意思。翻译做2020年，先划句子主干再写中文。作文进入固定模板阶段：小作文每周3篇，覆盖通知、投诉、建议信；大作文写2021年图表和2022年图表各一篇，先列提纲再写全文，限时40分钟。模板以石雷鹏为主，想用Monkey就只取其中能记住的句式。\n\n把2023、2024年阅读的错题句读出声，确认自己能说清主语、谓语和转折关系；翻译不要追求漂亮中文，先保证主干关系没有译反。", "politics": "政治读腿姐手册毛中特和思修法基，毛中特按理论发展线索看，思修重点看理想信念、人生观、道德和法律基础。苍盾每天30题，周末做一套选择题并统计四个板块正确率。政治一页纸读毛中特框架，肖八如果已经发布可以每周做1到2套选择题；如果还没有，就继续苍盾，不等待新资料。\n\n周末用30分钟讲一遍四个政治板块，再看肖八是否发布。新资料到手后先按套做，不要一看到新书就把腿姐手册和政治一页纸全部换掉。", "major": "858本周做真题册中的2023年真题，第一天限时完成，第二天讲解，第三个学习块按错题章节做余哥计算专项300题。重点练综合题的读题顺序：先判断信号类型和系统性质，再判断用时域、频域还是变换域；拉普拉斯题先看初始条件，Z变换题先看序列左右边和收敛域。把2015至2022年错题按这三种方法各挑3题重做。\n\n把2023、2024年真题的错题与何子述章节表对照，确认第3、4章傅里叶部分和第5、7章变换部分都有自己的典型题，缺的就从300题再做同类练习。"}, {"week": 8, "dates": "2026.11.10 - 2026.11.16", "title": "近年真题第二轮，开始固定四科时间", "note": "这周开始把每天的公共课和858时间固定下来，不能因为某一科题难就把其他科全部挤掉。每天都留出一点时间做轻任务，避免晚上只剩看视频。", "math": "数学一第二轮做2021、2022年真题，按一天一套限时，第二天上午只改错，下午做对应专题。错题专题安排为：极限和导数6题、积分和多元6题、微分方程和级数6题、线代6题、概率6题。重点处理计算准确率：每道大题末尾留一分钟检查范围、负号、初值和矩阵行列式。武忠祥选填技巧课继续看与自己错题相关的内容，不把技巧课当主要复习。周末用880综合部分做一组混合题，数量控制在20题以内，错题全部写出第一步。\n\n周末做一次90分钟数学混合训练，内容由真题选填、线代计算、二重积分和概率分布组成。结束后把计算错误分成四类，下一周开始前只选最常见的一类处理。", "english": "英语一做2023、2024年阅读与新题型，二刷文章不再逐句翻译，只看文章结构和题目依据。完型做2016、2017年，翻译做2021年。作文完成小作文第二轮，每周写3篇并隔一天默写一篇；大作文做2023年和2024年图表各一篇。把常用的开头、比较数据、原因段、建议段和结尾整理在真题伴侣或电子笔记中，句子以自己能写为准。单词继续不背单词每天复习，生词集中从真题伴侣里看。\n\n这周结束后选两篇阅读做第三次快速回看，只看文章结构和定位句。若某篇仍然错在同一类选项，就把错因写成一句提醒，后面遇到相似选项先看这句。", "politics": "政治完成腿姐手册第二轮的毛中特、思修法基和当代部分，苍盾每天30题。肖八若已发布，本周做前两套选择题，做完只看错题；没有发布则继续苍盾。每天读澄箫宇政治一页纸10分钟，周末用30分钟把马原、史纲、毛中特、思修各讲一遍。政治不安排长视频，避免抢数学和858时间。\n\n把苍盾反复错的题截成小清单，按马原概念、史纲时间、毛中特表述分类。每天只看一类，政治任务保持短，不要用长时间听课来缓解焦虑。", "major": "858暂时不追新的整套，先做2024年真题或真题册中最新一套可用卷。第一天限时，第二天解析，第三天做余哥300题对应小题。之后把2019至2023年真题中出现过的题型按章归类：第1章定义和系统性质，第2章卷积与零输入零状态响应，第3、4章傅里叶级数、傅里叶变换和频域系统，第5章拉普拉斯与系统函数，第6章差分方程和离散卷积，第7章Z变换和稳定性。每个章节写一页纸，标出自己最容易漏条件的地方。\n\n小套卷订正时把每道题的得分点写在题旁：定义是否完整、图是否标轴、公式条件是否写出、计算步骤是否连续。858不是只看最后答案，过程分要靠书写拿到。"}, {"week": 9, "dates": "2026.11.17 - 2026.11.23", "title": "从做新卷转向错题和高频题型", "note": "到这个阶段，题目不需要越做越多，而是要让常见题的步骤稳定。做错题时别急着看下一题，先把题目重新读一遍，判断自己到底卡在概念、入口还是计算。", "math": "数学一用三天处理2023至2025年真题错题和近三年选填，剩余时间做2024年整套模拟训练一次。模拟只看完成度和时间，不拿分数作结论。专题安排：周一多重积分和线面积分，周二二次型和矩阵解，周三联合分布与随机变量函数；每块做10题左右。把所有计算错误再分为看错题目、公式用错、过程漏项、最后算错四种，后两种要在草稿纸上留检查位置。李林6+4若已有，本周做第1套和第2套，每套限时，难题不长时间卡住。\n\n每套李林卷完成后，先记录自己用了多长时间，再把错题分成真题常见题和模拟卷偏难题。前一类需要重做，后一类只看方法，不用因为模拟卷分数变化打乱安排。", "english": "英语一做2022至2024年整套客观题，阅读与新题型按正式顺序安排，第二天订正。完型做2018、2019年，翻译做2022年。作文每周写4篇，其中小作文2篇、大作文2篇，至少有一篇在答题纸上完成。整理一张作文错误清单：第三人称、时态、单复数、拼写、标点、段落格式。单词不再追求扩大范围，主要回看不背单词中反复错的词和真题伴侣的标记词。\n\n本周四篇作文里挑一篇小作文和一篇大作文，在不看模板的情况下写；写完再对照自己的版本改错，能独立写出来的句子才真正适合考场。", "politics": "政治若拿到肖八，做第3至第4套选择题；没拿到就做苍盾每天30题。腿姐手册按错题回看，重点看马原概念、史纲时间线和毛中特表述。开始读肖八选择题解析中的知识点，但不抄全文。政治一页纸本周完整读两遍，周末用一张纸写出马原四部分和史纲主要时间线。主观题暂时不安排大量背诵，先把选择题正确率稳住。\n\n肖八主观题先圈问题中的动作词和主题词，不急着背答案。每天苍盾做完后用5分钟回看错题，主观题时间放到肖四发布后集中使用。", "major": "858本周不安排新教材章节，做真题错题第二轮。每天从错题表里选8到10题，先遮住解析重做，再回何子述教材查条件。重点是卷积区间的写法、傅里叶变换对偶与时移、拉普拉斯初值定理、Z变换收敛域和因果稳定判断。另做余哥计算专项300题中最常错的15题。周末做一次858小套卷，包含2道填空、2道简答、2道画图或证明、3道计算，限时90分钟，检查答题字迹和步骤。\n\n半卷训练后检查自己是否在填空题上写清结果、简答题上写出条件、画图题上标出坐标和关键点。把不会的题按章节贴回何子述书里，不另做一本泛泛的错题本。"}, {"week": 10, "dates": "2026.11.24 - 2026.11.30", "title": "模拟卷开始，但真题错题仍是主线", "note": "模拟卷的作用是练时间和心态，不是拿来替代真题。真题里错过的题要继续回看，模拟卷里偏难的题看懂方法即可，不在上面耗一晚上。", "math": "数学一做李林6+4第3至第5套，按每天一套或两天一套完成，优先保证选择填空和中档大题。每套卷第二天整理错题，记录题型和第一步；偏难压轴题不长时间停留。用一天重做真题错题本里的线面积分、二重积分、秩1矩阵和联合分布各5题。武忠祥选填技巧课看完与自己错误相关的章节，做题时仍以正常方法为主。周末整理一张“考场检查表”：积分上下限、矩阵行列式、概率范围、初值条件、最后单位和符号。\n\n周末做近三年真题的一套后，不只看总分，把每道失分题标为知识、方法、计算或时间问题。下周回看错题本时按这个标记处理，避免重复做无关题。", "english": "英语一做2024年和2025年真题，若2025年真题尚未有完整版本，就改做2020年整套二刷。作文每周4篇，保持小作文两篇、大作文两篇；本周重点写图表变化、原因分析、建议和社会现象。新题型做2024、2025中能找到的题，排序题先写段落关系再选。完型和翻译各做一套，订正只写错因和词组，不做全文精翻。继续每天复习不背单词，真题里的熟词新义优先看。\n\n本周完整整卷做完后，把作文答题纸和阅读错题一起看一遍，确认自己在规定时间里能留下检查时间。后面英语不再追求多做新年份，主要回看错题和模板。", "politics": "肖八若已到手，本周完成第5至第6套选择题；如果没有，就用苍盾完成每天30题。腿姐手册第三轮开始，每天读马原或史纲一小节，读完用自己的话说两分钟。政治一页纸挑错题最多的板块读，红果研框图只做定位。可以开始浏览肖八主观题材料，但不抢数学和858的时间，暂时只圈主题和关键词。\n\n肖八选择题做完后，统计每套错题数量并找出重复概念。腿姐手册、政治一页纸和肖八解析只围绕这些重复概念看，不增加新的长课程。", "major": "858开始做第二轮近年卷的混合训练：从2021至2024年真题中每天挑一套的半卷，上午或下午限时90分钟，晚上把错题贴回第1至7章。重点看成电858常见题型的完整表达：填空题公式和结果写清，简答题先给结论再写条件，画图题标出关键时间点和幅值，计算题按方法选择写步骤。余哥300题本周做20题，集中在傅里叶、拉普拉斯和Z变换。奥本海姆只查频域和变换域中仍然混淆的定义。\n\n完整858卷结束后，选三道自己写得最不顺的题重做，分别来自连续时域、频域和离散变换域。重做时把解题方法先写在题目上方，再开始推算。"}, {"week": 11, "dates": "2026.12.01 - 2026.12.07", "title": "把四科都放进正式考试节奏", "note": "最后三周不再安排大段新课程。每天要有一套或半套题的限时练习，也要有当天订正。睡眠和学习时间尽量固定，晚上不要用熬夜换进度。", "math": "数学一做李林6+4第6至第7套，或没有该资料时做近年真题错题混合卷。每套完成后只整理选择填空和中档大题，难题看解析后写出方法，不重复抄答案。把真题错题本中仍然错过两次的题再做一遍，重点是线面积分、二重积分、二次型、联合分布和随机变量函数。每天花20分钟看数一知识点汇总笔记，看到公式要马上说出使用条件。周末做近三年真题中的一套完整卷，严格按考试时间，结束后留出半小时检查。\n\n数学考前清单完成后，拿其中的公式条件各举一道题，不要求写难题，只确认自己知道什么时候用。最后三天不再比较模拟分数，把时间放在真题错题和睡眠上。", "english": "英语一做2023至2025年中最薄弱的一套整卷，按考试顺序完成，作文必须写在答题纸上。订正时只做三件事：阅读找依据、新题型找段落关系、翻译和作文改低级错误。作文本周写2篇小作文、2篇大作文，并至少默写两次自己的模板。继续每天背单词，真题伴侣中的标记词不再扩大，只把反复错的词读熟。Monkey和石雷鹏不再来回换，现有模板能写就继续用。\n\n英语考前把小作文格式和大作文段落各默写一遍，检查是否有自己经常写错的拼写。最后几天只看熟词新义和熟悉文章，不再尝试记一套陌生模板。", "politics": "肖八完成剩余选择题，按每天一套或半套处理，错题回腿姐手册和政治一页纸。开始按肖八主观题目录熟悉问题，不背整段，先记每题的主题、原因、措施和意义。肖四如果已经发布，先做选择题并等待后续背诵安排；还没有就继续肖八。苍盾每天30道保持，政治总时长控制在40到50分钟。\n\n肖四主观题最后一遍背诵以题目主线和分点为主，想不起原句时用材料组织答案。考前两天只看熟悉资料，保持苍盾错题和一页纸的短时间回看。", "major": "858做一套完整的近年真题或自组卷，限时3小时，按正式卷面写，不边做边查教材。第二天逐题订正，统计填空、简答、画图、证明、计算各类得分。随后用三天把何子述第1至7章重新过一遍：第1天第1至2章，第2天第3至4章，第3天第5至7章，每章只看定义、公式、典型题和自己错题。余哥300题只做错题同类题，每天10题。\n\n858考前清单完成后，把第1至7章各挑一道最熟悉的典型题，按考试纸面完整写一遍。写完检查符号、单位、边界和条件，最后两天只看这些页面。"}, {"week": 12, "dates": "2026.12.08 - 2026.12.14", "title": "停止开新资料，集中处理最后一遍错题", "note": "这周的任务不是把所有资料都看完，而是把已经整理出来的内容再写一遍。新的模拟卷看一两套即可，最后阶段不要因为群里的押题和排名改变自己的安排。", "math": "数学一做李林6+4第8至第10套，按每天一套完成，重点只放在选择填空、常规大题和自己熟悉的综合题。模拟卷订正当天完成，偏难题只看关键步骤。每晚回看真题错题本10到15题，周末把近三年真题中最常错的章节各选2题重做。武忠祥选填技巧课只看笔记里标过的两类方法，不再听新的长课。把数学知识汇总笔记压成一张考前清单：公式条件、常见图形、概率分布、线代计算、计算检查。\n\n考前清单旁边再写一行做题顺序：先读条件、再找题型、写出第一步、最后留时间检查。周末把近三年真题中最容易看错的题目各重做一遍，做完就停，不再开新的综合题。", "english": "英语一做一套近年真题作为最后一次完整模拟，其他时间二刷错题文章。作文每天写或默写一篇，轮换小作文和大作文，写完只检查格式、时态、单复数、拼写。新题型再做两套自己曾经错过的排序题，翻译回看近三年的长难句。单词每天保持20到30分钟，重点看真题伴侣里标记的熟词新义。不要全文精翻，也不要在这周更换老师和模板。\n\n本周英语只留熟悉材料：近年阅读错题、真题伴侣标记词、小作文格式和大作文段落。作文各写一篇后检查卷面，确认自己能在规定时间内写完并留出几分钟看拼写。", "politics": "肖四发布后优先做选择题，主观题按四套卷的题目顺序开始背，每天安排1到1.5小时，先背每题的分点标题和关键词，再尝试合上材料说完整。肖四未发布则先背肖八主观题的主题框架。腿姐手册每天读一遍错题最多的页，政治一页纸早晚各看一小段。苍盾不必每天刷很多，保持30道即可。\n\n肖四主观题按四套卷轮换复述，先看题目再说分点，不要每次都从头默写长答案。腿姐手册只看错题页，政治一页纸每天十分钟，苍盾错题不再新增长记录。", "major": "858本周只做最后一套完整模拟或真题，限时3小时，做完当天不再开新卷，第二天完整订正。剩余时间每天按一个主题回看：卷积和LTI、傅里叶级数与变换、拉普拉斯与系统函数、离散时域与差分方程、Z变换与收敛域。余哥300题只做自己曾经错的题，能独立写出方法就停。周末整理858考场清单：系统性质条件、卷积积分区间、变换对、初值终值、收敛域、因果稳定、画图坐标和单位。\n\n858本周完成最后一次章节抽查，按第1至7章每天看一章的目录和错题页。把最容易忘的四件事写在纸上：卷积区间、变换条件、初值终值、收敛域与稳定性，考前每天看一次。"}, {"week": 13, "dates": "2026.12.15 - 2026.12.20", "title": "按会做的内容上场，保证步骤和时间", "note": "最后六天不再开新的体系。每天保持一点计算和背诵，晚上把第二天要看的资料准备好。考场上先做有把握的题，卡住就先标记，整张卷子的时间安排比一道难题更重要。", "math": "数学一前两天各做一组真题错题选填和3到4道熟悉的大题，第三天只看知识点汇总笔记和自己的检查清单，之后不再做整套新卷。重点回看极限、积分、线性代数计算、概率分布和多元积分中的常错点。每天写几道计算题保持手感，写完检查负号、上下限、行列式和最后结果。李林模拟卷不再新增，近三年真题只看错题和做题顺序。考试前一天把准考证、身份证、文具和路线准备好，保证睡眠。\n\n考试前一天只看一页公式条件和自己写的检查清单，数学不做新模拟。准备好准考证、身份证、黑色签字笔和透明文具袋，早点休息，第二天按平时练过的顺序写。", "english": "英语一前两天各做一篇阅读和一篇新题型，之后只看熟悉的真题错题、作文模板和真题伴侣标记词。小作文和大作文各完整写一篇，检查开头、段落、结尾和格式。单词每天用20分钟维持，不再追陌生低频词。把自己的答题顺序写在纸上，例如先阅读还是先作文、完型和翻译各留多久，考场按平时练过的顺序执行。不要在考前晚上看陌生长难句课程。\n\n英语进考场前只看自己的作文模板、格式和几个常错拼写，不再看陌生文章。按练习过的顺序安排阅读、新题型、翻译、完型和作文，遇到难题先标记，最后统一检查答题卡。", "politics": "肖四主观题按每天一到两轮背诵，先背题目主线、分点和关键词，忘记原句时用材料和自己的话写完整。肖八和苍盾错题只看反复错的地方，腿姐手册和政治一页纸每天各读一小段。考前最后两天不再加新模拟卷，最后几天看B站讲政治答题时如何从材料中找关键词、组织成完整答案，练一两道就停。\n\n政治考前最后一晚只看肖四分点标题、腿姐手册标记页和政治一页纸，不再添加新资料。大题忘了原句时先审材料、找关键词、按分点写，选择题做完检查涂卡。", "major": "858前两天各做5到8道已整理过的典型题，覆盖卷积、傅里叶、拉普拉斯、差分方程和Z变换，不做陌生偏题。第三天到考前只看何子述第1至7章的目录、公式条件和自己的错题页，尤其再看第7章收敛域、因果稳定和系统函数。可以口头过一遍填空、简答、画图、证明和计算的答题顺序。考试时先写熟悉的定义和计算，证明题写清条件与结论，综合题按小问拿分，不因为一道题卡住影响后面的题。\n\n858进考场前只看何子述教材的章节目录、典型题和错题页，不再翻奥本海姆新内容。卷面先写会做的定义和计算，综合题按小问写，证明题把已知条件、推理和结论写齐。"}]};
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
for (const key of ['main','math','major','english','politics']) document.getElementById('overview-'+key).textContent = plan.overview[key];
const subjectNames = {math:'数学一',english:'英语一',politics:'政治',major:'858信号与系统'};
const list = document.getElementById('weeks');
plan.weeks.forEach((w, i) => {
  const box = document.createElement('article'); box.className='week'+(i===0?' open':'');
  box.innerHTML = `<div class="week-head" role="button" tabindex="0"><h3>第${w.week}周：${esc(w.title)}</h3><span class="dates">${esc(w.dates)}</span></div><div class="week-body"><div class="note">${esc(w.note)}</div><div class="subjects">${['math','major','english','politics'].map(k=>`<article class="subject ${k}"><h4>${subjectNames[k]}</h4><p>${esc(w[k])}</p></article>`).join('')}</div></div>`;
  const head = box.querySelector('.week-head'); head.addEventListener('click',()=>box.classList.toggle('open')); head.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();box.classList.toggle('open')}});
  list.appendChild(box);
});
let expanded=false;
document.getElementById('toggle').addEventListener('click',()=>{expanded=!expanded;document.querySelectorAll('.week').forEach(x=>x.classList.toggle('open',expanded));document.getElementById('toggle').textContent=expanded?'全部收起':'展开全部';});
</script>
</body>
</html>
